name: P22 S2 Stager
on:
  push:
    branches: [codex/P22-S2-stager]
    paths: [.github/workflows/p22-s2-stager.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply and verify exact P22-S2 patch
        shell: bash
        run: |
          python - <<'PY'
          import base64,zlib
          b=""
          open('/tmp/p22s2.patch','wb').write(zlib.decompress(base64.b64decode(b)))
          PY
          git apply --check /tmp/p22s2.patch
          git apply /tmp/p22s2.patch
          test "$(git hash-object doc/PLAN.md)" = "0003c8fdce92052a677833db4c14845025759322"
          test "$(git hash-object src/main/java/org/nonprofitbookkeeping/ui/BankTransactionsPanel.java)" = "d335869a004e1a26d688bc2b475c8a3a2ad2dd31"
          test "$(git hash-object src/test/java/org/nonprofitbookkeeping/ui/BankStatementExportPermissionBindingTest.java)" = "dfe7f8ff1c6de48dc51f44e44ea6c7f8cd519ae1"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/PLAN.md src/main/java/org/nonprofitbookkeeping/ui/BankTransactionsPanel.java src/test/java/org/nonprofitbookkeeping/ui/BankStatementExportPermissionBindingTest.java
          git commit -m "P22-S2: correct bank export permission binding"
          git push
