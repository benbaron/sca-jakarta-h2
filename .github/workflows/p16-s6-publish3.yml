name: P16-S6 patch publish final retry

on:
  push:
    branches:
      - codex/P16-S6-budget-draft-fiscal-period-authority
    paths:
      - .github/workflows/p16-s6-publish3.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout S6 branch
        uses: actions/checkout@v4
        with:
          ref: codex/P16-S6-budget-draft-fiscal-period-authority
          fetch-depth: 0

      - name: Apply intended S6 patch
        shell: bash
        run: |
          set -euxo pipefail
          {
            cat .p16-s6.patch.part0
            printf '\n'
            cat .p16-s6.patch.part1
            cat .p16-s6.patch.part2
            cat .p16-s6.patch.part3
          } > /tmp/p16-s6.patch
          git apply --check /tmp/p16-s6.patch
          git apply --index /tmp/p16-s6.patch
          rm .p16-s6.patch.part0 .p16-s6.patch.part1 .p16-s6.patch.part2 .p16-s6.patch.part3
          rm .github/workflows/p16-s6-publish.yml .github/workflows/p16-s6-publish2.yml .github/workflows/p16-s6-publish3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "P16-S6 establish budget draft and fiscal-period authority"
          git push origin HEAD:codex/P16-S6-budget-draft-fiscal-period-authority
