name: P20-S3 database-admin publication bootstrap

on:
  push:
    branches:
      - codex/P20-S3-dbadmin-publication-bootstrap

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish reviewed database-admin tranche
        shell: bash
        env:
          BASE_SHA: 56c792c3787ac0a0d9cef980e8a07bee07b26b1c
          TARGET_BRANCH: codex/P20-S3-database-administration-authorization
          PATCH_SHA256: 8198754444ce90f3a13c63e6bac149c02007411cc29015bc3167058647b354f7
        run: |
          set -euo pipefail
          cp .github/p20-s3-dbadmin.patch.gz /tmp/p20-s3-dbadmin.patch.gz
          echo "$PATCH_SHA256  /tmp/p20-s3-dbadmin.patch.gz" | sha256sum -c -

          git checkout --detach "$BASE_SHA"
          gunzip -c /tmp/p20-s3-dbadmin.patch.gz > /tmp/p20-s3-dbadmin.patch
          git apply --check /tmp/p20-s3-dbadmin.patch
          git apply /tmp/p20-s3-dbadmin.patch
          git diff --check

          cat > /tmp/expected-paths <<'EOF'
          doc/P20-S3-authenticated-audit-actor.md
          doc/P20-S3-database-administration-authorization.md
          doc/P20-S3-runtime-authorization.md
          doc/PLAN.md
          doc/administration/company-lifecycle.md
          doc/data-exchange/database-transfer.md
          doc/data-exchange/shared-operation-contract.md
          doc/interface-operation-matrix.md
          doc/ui/editor-guidelines.md
          src/main/java/org/nonprofitbookkeeping/service/CompanyOwnershipService.java
          src/main/java/org/nonprofitbookkeeping/service/DatabaseAdministrationService.java
          src/main/java/org/nonprofitbookkeeping/service/SampleCompanyService.java
          src/main/java/org/nonprofitbookkeeping/service/ServiceAuthorization.java
          src/main/java/org/nonprofitbookkeeping/ui/CompanyOwnershipDiagnosticsPanel.java
          src/main/java/org/nonprofitbookkeeping/ui/DatabaseTransferCoordinator.java
          src/main/java/org/nonprofitbookkeeping/ui/UiServiceRegistry.java
          src/main/java/org/nonprofitbookkeeping/ui/WorkspaceServicesFactory.java
          src/test/java/org/nonprofitbookkeeping/service/DatabaseAdministrationAuthorizationIntegrationTest.java
          src/test/java/org/nonprofitbookkeeping/ui/DatabaseAdministrationProductionRouteSourceTest.java
          EOF
          sed -i 's/^          //' /tmp/expected-paths
          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort > /tmp/actual-paths
          sort -o /tmp/expected-paths /tmp/expected-paths
          diff -u /tmp/expected-paths /tmp/actual-paths

          cat > /tmp/expected-blobs <<'EOF'
          b9f9c1c22327fc0773c946aa457c51c629b184cc doc/P20-S3-authenticated-audit-actor.md
          2bd217b949e0220bd6d4d3c2965e88c119eabcb4 doc/P20-S3-database-administration-authorization.md
          ef49f340ac8352fb3c04dd557b7824c1d57fec1c doc/P20-S3-runtime-authorization.md
          0d29329974067b9c7376896c2e18de21f0508888 doc/PLAN.md
          53eb31b06a57fe954f5d01614e5c44aeecdb37c8 doc/administration/company-lifecycle.md
          46d5268b079308e3772f1d622cf0288714385c88 doc/data-exchange/database-transfer.md
          cb825e65e5f4159d6352fa9ec391258cc8b60283 doc/data-exchange/shared-operation-contract.md
          ce1a0903f4b7efb6ecf72b2348ecbd80f3a3140d doc/interface-operation-matrix.md
          0420f25796b922f02fdfedf9dd6fd96a8f8d4823 doc/ui/editor-guidelines.md
          a95ac66cc0693fa448fca92abf6f80adea20d7bb src/main/java/org/nonprofitbookkeeping/service/CompanyOwnershipService.java
          e21e2786440b245ed943b8f9b4a6e4cc6c6ec9a9 src/main/java/org/nonprofitbookkeeping/service/DatabaseAdministrationService.java
          666a95045022895d1b64dd39df01c7f3e4c153f9 src/main/java/org/nonprofitbookkeeping/service/SampleCompanyService.java
          4261f6dacbc9528d475ccd6cb4a99bfbb455954d src/main/java/org/nonprofitbookkeeping/service/ServiceAuthorization.java
          9473782e836a07ab5dec04e76b2bf7063776ae58 src/main/java/org/nonprofitbookkeeping/ui/CompanyOwnershipDiagnosticsPanel.java
          d65f944f04f115a5449fd8246cf0f420e61fb9ab src/main/java/org/nonprofitbookkeeping/ui/DatabaseTransferCoordinator.java
          ddea2330214888f4457c50f93842002599218231 src/main/java/org/nonprofitbookkeeping/ui/UiServiceRegistry.java
          55cbe5c55a8ab57f2dbf92aa9ee7b421b43edc69 src/main/java/org/nonprofitbookkeeping/ui/WorkspaceServicesFactory.java
          b82ebae2f89ffde701a8e5832b60b18adee98e6b src/test/java/org/nonprofitbookkeeping/service/DatabaseAdministrationAuthorizationIntegrationTest.java
          afc231c4be01b41384708715dcc34f843f19abb0 src/test/java/org/nonprofitbookkeeping/ui/DatabaseAdministrationProductionRouteSourceTest.java
          EOF
          sed -i 's/^          //' /tmp/expected-blobs
          while read -r expected path; do
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected" || { echo "Blob mismatch: $path expected $expected got $actual"; exit 1; }
          done < /tmp/expected-blobs

          remote_target="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_target" = "$BASE_SHA" || { echo "Target branch moved: $remote_target"; exit 1; }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "P20-S3: enforce database administration authorization"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
