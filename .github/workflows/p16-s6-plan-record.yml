name: P16-S6 plan validation record

on:
  push:
    branches:
      - codex/P16-S6-budget-draft-fiscal-period-authority
    paths:
      - .github/workflows/p16-s6-plan-record.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout S6 branch
        uses: actions/checkout@v4
        with:
          ref: codex/P16-S6-budget-draft-fiscal-period-authority
          fetch-depth: 0

      - name: Record S6 validation
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import base64
          exec(base64.b64decode(''))
          PY
          rm .github/workflows/p16-s6-plan-record.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record P16-S6 implementation validation"
          git push origin HEAD:codex/P16-S6-budget-draft-fiscal-period-authority
