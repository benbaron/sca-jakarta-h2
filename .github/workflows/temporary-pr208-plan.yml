name: Temporary PR208 plan reconciliation

on:
  push:
    branches:
      - codex/P15-S4-sclx-deterministic-file-export

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, 'Reconcile P15 plan for PR208') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile execution ledger
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('doc/PLAN.md')
          text = path.read_text()
          replacements = [
              ('plan_version: 82', 'plan_version: 83'),
              ('active_status: IN_PROGRESS', 'active_status: VERIFYING'),
              ('active_branch: codex/P15-S4-sclx-budget-transaction-snapshot', 'active_branch: codex/P15-S4-sclx-deterministic-file-export'),
              ('active_pull_request: 207', 'active_pull_request: 208'),
              ('active_head: "3914cdaf42f0c1e3939cca4ca3cb7add4fe4291a"', 'active_head: "43b6ada84f7531d7e235aac4d0ac6b7f9ae60ffb"'),
              ('next_action: "Validate and merge PR #207, then implement deterministic SCLX serialization and atomic file output on a fresh P15-S4 branch."', 'next_action: "Validate and merge PR #208, then continue P15-S4 with additional selected-company sections and production JavaFX export wiring on a fresh branch."'),
              ('This revision records merged P15-S4 portable transaction identity through PR #206 and selected-company budget and canonical-transaction snapshot mapping in draft PR #207.', 'This revision records merged selected-company financial snapshot mapping through PR #207 and deterministic atomic SCLX file export in draft PR #208.'),
              ('Status: IN_PROGRESS on branch `codex/P15-S4-sclx-budget-transaction-snapshot` in draft PR #207.', 'Status: VERIFYING on branch `codex/P15-S4-sclx-deterministic-file-export` in draft PR #208.'),
              ('Current tested implementation head: `3914cdaf42f0c1e3939cca4ca3cb7add4fe4291a`', 'Current tested implementation head: `43b6ada84f7531d7e235aac4d0ac6b7f9ae60ffb`'),
              ('- PR #207: selected-company budget plan/line and canonical `Txn`/`TxnSplit` snapshot mapping, including period-scoped budget identities, exact debit/credit conversion, correction links, deterministic business ordering, and cross-company rejection.', '- PR #207: selected-company budget plan/line and canonical `Txn`/`TxnSplit` snapshot mapping, including period-scoped budget identities, exact debit/credit conversion, correction links, deterministic business ordering, and cross-company rejection.\n- PR #208: deterministic Jackson tree serialization, guarded same-directory atomic file replacement, overwrite/path/active-database protections, SHA-256, entity counts, deferred-section warnings, and explicit exclusions.'),
              ('- PRs #198 through #206 are merged.', '- PRs #198 through #207 are merged.'),
              ('- PR #207 run `30231944656` passed on clean implementation head `3914cdaf42f0c1e3939cca4ca3cb7add4fe4291a`, including `mvn clean verify`, the repeated test suite, and JavaFX production-route compliance.', '- PR #207 run `30231944656` passed on clean implementation head `3914cdaf42f0c1e3939cca4ca3cb7add4fe4291a`, including `mvn clean verify`, the repeated test suite, and JavaFX production-route compliance.\n- Final PR #207 run `30232140766` passed on plan-inclusive head `cf14dfe6bcbae194e44c140060f82c0dcf8e8b68`; PR #207 merged at `d35281a558083b28117dc6668324d117aa6e7cf9`.\n- Initial PR #208 run `30235977494` exposed one extra closing parenthesis in the new serializer test fixture; production sources compiled and the fixture was corrected.\n- Focused PR #208 verification passed 7 tests with 0 failures and 0 errors after the correction.\n- Maven PR Tests run `30236206639` passed on clean implementation head `43b6ada84f7531d7e235aac4d0ac6b7f9ae60ffb`, including `mvn clean verify`, the repeated test suite, and JavaFX production-route compliance.'),
              ('- Validate and merge PR #207, then start a fresh P15-S4 branch for deterministic Jackson serialization, atomic file output, overwrite/path protections, operation counts, warnings/exclusions, and SHA-256.', '- Validate and merge PR #208, then start a fresh P15-S4 branch for additional governed selected-company section mapping and production JavaFX export wiring/result presentation.')
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing PLAN.md text: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add doc/PLAN.md
          git commit -m 'Reconcile P15 plan for PR208'
          git push
