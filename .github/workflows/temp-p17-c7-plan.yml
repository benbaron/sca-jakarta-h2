name: Temporary P17-C7 plan activation

on:
  push:
    branches:
      - codex/P17-C7-fixed-asset-lifecycle

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Activate C7 controller
        run: |
          python .tmp/p17_c7_plan.py
          git diff --check
      - name: Publish plan and remove temporary artifacts
        run: |
          rm -f .tmp/p17_c7_plan.py .github/workflows/temp-p17-c7-plan.yml
          rmdir .tmp 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'P17-C7: activate fixed-asset lifecycle plan'
          git push origin HEAD:codex/P17-C7-fixed-asset-lifecycle
