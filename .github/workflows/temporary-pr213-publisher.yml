name: Temporary PR213 publisher diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ github.event.pull_request.head.ref == 'codex/P15-S4-sclx-supplemental-details' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout supplemental-detail branch
        uses: actions/checkout@v4
        with:
          ref: codex/P15-S4-sclx-supplemental-details
          fetch-depth: 0
      - name: Capture publisher diagnostics
        shell: bash
        run: |
          set +e
          {
            echo "encoded expected f14c3a515d1f0dd363d65e2d66a794dbefa88ec5741ebd549f223f572f055b85"
            sha256sum .p15-publish/pr213.patch.gz.b64
            base64 -d .p15-publish/pr213.patch.gz.b64 > /tmp/pr213.diff.gz
            echo "decode status $?"
            echo "gzip expected 6d215c81add9ec1914a79f772b2bda1a63418353dcc9e309adce9802d4804cb9"
            sha256sum /tmp/pr213.diff.gz
            gzip -dc /tmp/pr213.diff.gz > /tmp/pr213.diff
            echo "gunzip status $?"
            echo "diff expected d598072980adb15ded9a6dcbe9860868360f5567a319ebfc9ee048870de35409"
            sha256sum /tmp/pr213.diff
            echo "patch dry run"
            patch --dry-run --batch --forward -p1 < /tmp/pr213.diff
            echo "patch status $?"
          } > pr213-publisher-diagnostic.log 2>&1
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pr213-publisher-diagnostic.log
          git commit -m "diagnose PR213 publisher" || exit 0
          git push
