name: Temporary PR213 supplemental-detail publisher

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.pull_request.head.ref == 'codex/P15-S4-sclx-supplemental-details' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout supplemental-detail branch
        uses: actions/checkout@v4
        with:
          ref: codex/P15-S4-sclx-supplemental-details
          fetch-depth: 0
      - name: Verify and apply reviewed supplemental-detail patch
        shell: bash
        run: |
          set -euo pipefail
          echo "18bcb96f03356c2163ebeb4746cd343adf315592fc36f61217da39fdac23d3ed  .p15-publish/pr213-patch/chunk-00" | sha256sum -c -
          echo "0012a81a0fe0f1ea5a72d52b913aa1dbec7e6d24149506ad4678c87c6b00f723  .p15-publish/pr213-patch/chunk-01" | sha256sum -c -
          echo "60fa132cdcd332ff2ccd294a0d8c8d6a3a3402d9dfc3541345d24c07526543b2  .p15-publish/pr213-patch/chunk-02" | sha256sum -c -
          echo "6068ecdd439e293d623d41363800fb1f21bfd0c0f40af11e849011eb5186d733  .p15-publish/pr213-patch/chunk-03" | sha256sum -c -
          echo "8166507d2ab197a6694ad8725efb956ff3ec6fd8ddba69344cecd34bade514a5  .p15-publish/pr213-patch/chunk-04" | sha256sum -c -
          cat .p15-publish/pr213-patch/chunk-* > /tmp/pr213.diff.gz.b64
          echo "f14c3a515d1f0dd363d65e2d66a794dbefa88ec5741ebd549f223f572f055b85  /tmp/pr213.diff.gz.b64" | sha256sum -c -
          base64 -d /tmp/pr213.diff.gz.b64 > /tmp/pr213.diff.gz
          echo "6d215c81add9ec1914a79f772b2bda1a63418353dcc9e309adce9802d4804cb9  /tmp/pr213.diff.gz" | sha256sum -c -
          gzip -dc /tmp/pr213.diff.gz > /tmp/pr213.diff
          echo "d598072980adb15ded9a6dcbe9860868360f5567a319ebfc9ee048870de35409  /tmp/pr213.diff" | sha256sum -c -
          patch --dry-run --batch --forward -p1 < /tmp/pr213.diff
          patch --batch --forward -p1 < /tmp/pr213.diff
          rm -rf .p15-publish pr213-publisher-diagnostic.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "P15-S4: export supplemental transaction details"
          git push
