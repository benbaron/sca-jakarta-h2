name: Temporary P17-C3 budget lifecycle publication

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.pull_request.head.ref == 'codex/P17-C3-budget-version-lifecycle' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout P17-C3 branch
        uses: actions/checkout@v4
        with:
          ref: codex/P17-C3-budget-version-lifecycle
          fetch-depth: 0

      - name: Apply reviewed P17-C3 and remove publication artifacts
        shell: bash
        run: |
          set -euo pipefail
          cat .p17-c3-publish/c3-00.txt \
              .p17-c3-publish/c3-01.txt \
              .p17-c3-publish/c3-02.txt \
            | tr -d '\n\r' \
            | base64 --decode \
            | gzip --decompress > /tmp/c3.patch
          echo 'cb1abaf364e6b41681f057ca9f1722c95bbf78f81eeca241958507562fc94579  /tmp/c3.patch' \
            | sha256sum --check
          git apply --check /tmp/c3.patch
          git apply /tmp/c3.patch
          git rm .p17-c3-publish/c3-00.txt \
                 .p17-c3-publish/c3-01.txt \
                 .p17-c3-publish/c3-02.txt \
                 .github/workflows/temporary-p17-c3-budget-lifecycle.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add doc/PLAN.md \
                  doc/accounting/budget-model.md \
                  doc/interface-operation-matrix.md \
                  doc/P17-C3-budget-version-lifecycle-user-testing.md \
                  src/main/java/org/nonprofitbookkeeping/service/BudgetPlanService.java \
                  src/main/java/org/nonprofitbookkeeping/ui/BudgetEditorPanel.java \
                  src/test/java/org/nonprofitbookkeeping/service/BudgetPlanServiceTest.java \
                  src/test/java/org/nonprofitbookkeeping/ui/BudgetFiscalAuthoritySourceTest.java \
                  src/test/java/org/nonprofitbookkeeping/ui/BudgetVersionLifecycleSourceTest.java
          git commit -m 'P17-C3: complete budget version lifecycle'
          git push
