name: Temporary PR212 party mapping publisher

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.pull_request.head.ref == 'codex/P15-S4-sclx-parties' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout party mapping branch
        uses: actions/checkout@v4
        with:
          ref: codex/P15-S4-sclx-parties
          fetch-depth: 0
      - name: Verify and apply reviewed party mapping
        shell: bash
        run: |
          set -euo pipefail
          echo "e60d64081ddad9efd3bdf703522b004755437f7d69b65df55799abd89a233153  .p15-publish/pr212.patch.gz.b64" | sha256sum -c -
          base64 -d .p15-publish/pr212.patch.gz.b64 > /tmp/pr212.patch.gz
          echo "8ba1d27305556d447d12bc69bd93a9c6c7f13d21f9b23f638917bc67f86cf4ff  /tmp/pr212.patch.gz" | sha256sum -c -
          gzip -dc /tmp/pr212.patch.gz > /tmp/pr212.patch
          echo "31f663bd5c7f9f4d08dcb20d22417c6fe7b69360630c7a13194fffedc3a583c2  /tmp/pr212.patch" | sha256sum -c -
          git apply --check /tmp/pr212.patch
          git apply /tmp/pr212.patch
          rm -rf .p15-publish
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "P15-S4: export company counterparties and merchants"
          git push
