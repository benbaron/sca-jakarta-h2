name: Apply P03-C8 source fix

on:
  pull_request:
    branches: [ "main" ]
    types: [ synchronize ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply compile fix
        run: python tools/apply_p03_c8_compile_fix.py

      - name: Commit source fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Source fix already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/org/nonprofitbookkeeping/ui/JournalWorkspaceCompliancePanel.java
          git commit -m "Fix Journal compliance sort-order restoration"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
