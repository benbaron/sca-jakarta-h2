name: Temporary P17-C6 implementation publisher

on:
  push:
    branches:
      - codex/P17-C6-fund-hierarchy-lifecycle

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed Fund hierarchy changes
        run: |
          python .tmp/p17_c6_apply.py
          grep -q 'validateHierarchyLifecycle' src/main/java/org/nonprofitbookkeeping/service/FundAdminService.java
          grep -q 'validateFunds(funds, fundIds, errors)' src/main/java/org/nonprofitbookkeeping/interchange/sclx/SclxStructureValidator.java
          grep -q 'requireActiveFundHierarchy(parent, active, externalId)' src/main/java/org/nonprofitbookkeeping/interchange/sclx/SclxImportCommitService.java
          test -f doc/funds/fund-lifecycle.md
          test -f doc/P17-C6-fund-hierarchy-lifecycle-user-testing.md
          test -f src/test/java/org/nonprofitbookkeeping/service/FundHierarchyLifecycleTest.java
          test -f src/test/java/org/nonprofitbookkeeping/interchange/sclx/SclxFundHierarchyLifecycleTest.java
          git diff --check
      - name: Publish product commit and remove temporary artifacts
        run: |
          rm -f .tmp/p17_c6_apply.py .github/workflows/temp-p17-c6-publisher.yml
          rmdir .tmp 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'P17-C6: enforce fund hierarchy lifecycle'
          git push origin HEAD:codex/P17-C6-fund-hierarchy-lifecycle
