name: Temporary PR212 plan reconciliation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ github.event.pull_request.head.ref == 'codex/P15-S4-sclx-parties' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout party mapping branch
        uses: actions/checkout@v4
        with:
          ref: codex/P15-S4-sclx-parties
          fetch-depth: 0
      - name: Reconcile P15-S4 execution ledger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('doc/PLAN.md')
          text = path.read_text()
          replacements = [
              ('plan_version: 87', 'plan_version: 88'),
              ('active_branch: codex/P15-S4-party-portable-identity', 'active_branch: codex/P15-S4-sclx-parties'),
              ('active_pull_request: 211', 'active_pull_request: 212'),
              ('active_head: "41280d0f26fe58afaf8f25fb71dd76035d2eebd8"',
               'active_head: "8364a1bd0abd8bc48f4673aa9e18bc28ebea5afc"'),
              ('next_action: "Validate and merge PR #211, then map selected-company counterparties and merchants into SCLX on a fresh P15-S4 branch."',
               'next_action: "Validate and merge PR #212, then map selected-company supplemental transaction details into SCLX on a fresh P15-S4 branch."'),
              ('This revision records selected-company Activity export merged through PR #210 and durable Counterparty/Merchant portable identity in draft PR #211.',
               'This revision records durable Counterparty/Merchant portable identity merged through PR #211 and selected-company party export in draft PR #212.'),
              ('Status: VERIFYING on branch `codex/P15-S4-party-portable-identity` in draft PR #211.',
               'Status: VERIFYING on branch `codex/P15-S4-sclx-parties` in draft PR #212.'),
              ('Current tested implementation head: `41280d0f26fe58afaf8f25fb71dd76035d2eebd8`',
               'Current tested implementation head: `8364a1bd0abd8bc48f4673aa9e18bc28ebea5afc`'),
              ('- PR #211: durable UUID portable identities for `Counterparty` and `Merchant`, with V63 backfill/default/non-null/uniqueness enforcement, entity initialization, migration tests, and identity-contract documentation.',
               '- PR #211: durable UUID portable identities for `Counterparty` and `Merchant`, with V63 backfill/default/non-null/uniqueness enforcement, entity initialization, migration tests, and identity-contract documentation.\n- PR #212: selected-company counterparty and merchant export, standard transaction-line payee references, deterministic line-level merchant links, strict ownership/reference validation, counts, inactive-row retention, and desktop acceptance updates.'),
              ('- PRs #198 through #210 are merged.', '- PRs #198 through #211 are merged.'),
              ('- Maven PR Tests run `30323574869` passed on clean, plan-inclusive PR #211 head `41280d0f26fe58afaf8f25fb71dd76035d2eebd8`, including `mvn clean verify`, the repeated Maven test suite, and JavaFX production-route compliance.',
               '- Maven PR Tests run `30323574869` passed on clean, plan-inclusive PR #211 head `41280d0f26fe58afaf8f25fb71dd76035d2eebd8`, including `mvn clean verify`, the repeated Maven test suite, and JavaFX production-route compliance.\n- Final PR #211 run `30323799799` passed on artifact-free review head `881dfed2d06f9104e166c82ecf9dbb81436a16ed`; PR #211 merged at `3b4a39dc8287b5ecd7dca57c213558619e7c90ac`.\n- Initial clean PR #212 run `30327910606` compiled production code and passed 437 of 438 tests but exposed a shifted `SclxExportCounts` test fixture after counterparties and merchants were added.\n- The fixture was corrected to preserve its intended budgets, transactions, transaction-lines, and total counts without changing production behavior.\n- Clean PR #212 implementation run `30328268651` passed `mvn clean verify`, the repeated Maven test suite, and JavaFX production-route compliance on head `8364a1bd0abd8bc48f4673aa9e18bc28ebea5afc`.'),
              ('- Validate and merge PR #211, then start a fresh P15-S4 branch to map selected-company counterparties and merchants using their durable UUID identities; complete owner desktop acceptance before P15-S4 is marked done.',
               '- Validate and merge PR #212, then start a fresh P15-S4 branch to map selected-company supplemental transaction details; complete owner desktop acceptance before P15-S4 is marked done.')
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence, found {count}: {old[:120]}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add doc/PLAN.md
          git commit -m "Reconcile P15-S4 party export plan"
          git push
