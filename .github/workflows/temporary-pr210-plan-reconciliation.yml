name: Temporary PR210 plan reconciliation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ github.event.pull_request.head.ref == 'codex/P15-S4-sclx-activities' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout activity branch
        uses: actions/checkout@v4
        with:
          ref: codex/P15-S4-sclx-activities
          fetch-depth: 0
      - name: Reconcile P15-S4 execution ledger
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('doc/PLAN.md')
          text = path.read_text()

          replacements = [
              ('plan_version: 84', 'plan_version: 85'),
              ('active_branch: codex/P15-S4-sclx-export-ui', 'active_branch: codex/P15-S4-sclx-activities'),
              ('active_pull_request: 209', 'active_pull_request: 210'),
              ('active_head: "18aac1b988a6604521e7d3f1e59bc310dd34a7fd"',
               'active_head: "a1699d91d3db13fc9f94869641654f1a29d9594e"'),
              ('next_action: "Validate and merge PR #209, then continue P15-S4 with the remaining governed selected-company section mappings on a fresh branch."',
               'next_action: "Validate and merge PR #210, then continue P15-S4 by establishing stable portable identity for counterparties and merchants before mapping that governed section on a fresh branch."'),
              ('This revision records deterministic atomic SCLX file export merged through PR #208 and the production selected-company File-menu export route in draft PR #209.',
               'This revision records the production selected-company SCLX export route merged through PR #209 and selected-company Activity export in draft PR #210.'),
              ('Status: VERIFYING on branch `codex/P15-S4-sclx-export-ui` in draft PR #209.',
               'Status: VERIFYING on branch `codex/P15-S4-sclx-activities` in draft PR #210.'),
              ('Current tested implementation head: `18aac1b988a6604521e7d3f1e59bc310dd34a7fd`',
               'Current tested implementation head: `a1699d91d3db13fc9f94869641654f1a29d9594e`'),
              ('- PR #209: production File-menu selected-company SCLX export with frozen company/database scope, asynchronous execution, explicit overwrite confirmation, exact counts/hash/warnings/exclusions presentation, route tests, and desktop acceptance instructions.',
               '- PR #209: production File-menu selected-company SCLX export with frozen company/database scope, asynchronous execution, explicit overwrite confirmation, exact counts/hash/warnings/exclusions presentation, route tests, and desktop acceptance instructions.\n- PR #210: selected-company Activity export under `extensions.scaJakartaH2.activities`, stable company/code identities, transaction-line activity references, strict extension/reference validation, deterministic ordering, counts, and inactive-row retention.'),
              ('- PRs #198 through #208 are merged.', '- PRs #198 through #209 are merged.'),
              ('- Maven PR Tests run `30239221873` passed on clean implementation head `18aac1b988a6604521e7d3f1e59bc310dd34a7fd`, including `mvn clean verify`, the repeated test suite, and JavaFX production-route compliance under Xvfb.',
               '- Maven PR Tests run `30239221873` passed on clean implementation head `18aac1b988a6604521e7d3f1e59bc310dd34a7fd`, including `mvn clean verify`, the repeated test suite, and JavaFX production-route compliance under Xvfb.\n- Final PR #209 run `30239456025` passed on plan-inclusive head `4717f19e533112255cc4fccf24742d9d8a3ac211`; PR #209 merged at `97d7b67fd601fb83b1e32d177690512e93e89592`.\n- Initial clean PR #210 run `30319123316` passed compilation and 429 of 430 tests but exposed a stale serializer assertion that expected custom extension key `alpha` before the newly governed, correctly sorted `activities` key.\n- Corrected PR #210 diagnostic run `30319427594` passed `mvn clean verify` with 430 tests, 0 failures, and 0 errors.\n- Clean PR #210 implementation run `30319554988` passed `mvn clean verify`, the repeated Maven test suite, and JavaFX production-route compliance on head `a1699d91d3db13fc9f94869641654f1a29d9594e`.'),
              ('- Validate and merge PR #209, then start a fresh P15-S4 branch for the remaining governed selected-company section mappings; complete owner desktop acceptance before P15-S4 is marked done.',
               '- Validate and merge PR #210, then start a fresh P15-S4 branch to establish stable portable identity for counterparties and merchants before mapping that governed section; complete owner desktop acceptance before P15-S4 is marked done.')
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence, found {count}: {old[:100]}')
              text = text.replace(old, new)

          path.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add doc/PLAN.md
          git commit -m "Reconcile P15-S4 activity export plan"
          git push
