name: P16 S3 UI patch

on:
  push:
    branches:
      - codex/P16-S3-reconciliation-mutation-integrity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/P16-S3-reconciliation-mutation-integrity
          fetch-depth: 0
      - name: Apply reconciliation finalized-state UI patch
        run: |
          cat .github/p16s3-ui-part00 .github/p16s3-ui-part01 > /tmp/p16s3_ui_patch.py
          python -m py_compile /tmp/p16s3_ui_patch.py
          python /tmp/p16s3_ui_patch.py
          rm .github/p16s3-ui-part00 .github/p16s3-ui-part01
          rm .github/workflows/p16-s3-ui-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make finalized reconciliation UI read-only"
          git push origin HEAD:codex/P16-S3-reconciliation-mutation-integrity
