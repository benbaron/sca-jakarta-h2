name: P16-S1 verification handoff

on:
  push:
    branches:
      - codex/P16-S1-atomic-monthly-depreciation

permissions:
  contents: write

jobs:
  update-plan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/P16-S1-atomic-monthly-depreciation
          fetch-depth: 0
      - name: Record verified P16-S1 state
        shell: python
        run: |
          from pathlib import Path

          path = Path('doc/PLAN.md')
          source = path.read_text(encoding='utf-8')
          simple = {
              'plan_version: 130': 'plan_version: 131',
              'active_status: IN_PROGRESS': 'active_status: VERIFYING',
              'active_pull_request: null': 'active_pull_request: 252',
              'active_head: 88bae9870255630c53e057d2bb201e9b41389479': 'active_head: 96175d54fd5c739ca29cf8bb35e49ebf89938d70',
              'next_action: "Reproduce the P16-S1 monthly-depreciation partial-write defect on current main, then implement one caller-owned atomic transaction with rollback coverage."': 'next_action: "Complete the P16-S1 owner desktop checklist on draft PR #252; if accepted, record owner approval and await explicit merge authorization. Do not start P16-S2."',
              '| P16 | Interface-to-authority completion and integrity corrections | P03-P15 except eliminated P07 | IN_PROGRESS through P16-S1 |': '| P16 | Interface-to-authority completion and integrity corrections | P03-P15 except eliminated P07 | VERIFYING through P16-S1 / PR #252 |',
              '**Status:** IN_PROGRESS through P16-S1\n**Depends on:** P03 through P15 except eliminated P07': '**Status:** VERIFYING through P16-S1 / PR #252  \n**Depends on:** P03 through P15 except eliminated P07',
          }
          old_header = '\n'.join([
              'Status: IN_PROGRESS.',
              '',
              'Branch: `codex/P16-S1-atomic-monthly-depreciation`',
              '',
              'Pull request: not opened yet.',
              'Starting base: `88bae9870255630c53e057d2bb201e9b41389479`',
          ])
          new_header = '\n'.join([
              'Status: VERIFYING in draft PR #252.',
              '',
              'Branch: `codex/P16-S1-atomic-monthly-depreciation`',
              '',
              'Pull request: #252  ',
              'Starting base: `88bae9870255630c53e057d2bb201e9b41389479`  ',
              'Validated implementation head: `96175d54fd5c739ca29cf8bb35e49ebf89938d70`',
          ])
          old_tail = '\n'.join([
              '- Multi-company, closed-period, and finalized-reconciliation protections cannot be bypassed.',
              '',
              '## P16-S2 — Atomic COA CSV accepted-row commit',
          ])
          new_tail = '\n'.join([
              '- Multi-company, closed-period, and finalized-reconciliation protections cannot be bypassed.',
              '',
              'Validation status:',
              '',
              '- The branch remains based on exact P16-S0 merge `88bae9870255630c53e057d2bb201e9b41389479` with no base drift.',
              '- Draft PR #252 implements one caller-owned JPA transaction for the canonical transaction, balanced splits, linked depreciation run, portable identities, and factual audit event, with authoritative refresh after commit or rollback.',
              '- Deterministic protection fixtures use governed values: `CALCULATED` for the period-close range and `OFX` for the legacy reconciliation-run compatibility row. Applied migration V7 remains unchanged.',
              '- Exact implementation head `96175d54fd5c739ca29cf8bb35e49ebf89938d70` passed `mvn clean verify`, the deliberately repeated Maven suite, and JavaFX production-route compliance in Maven PR Tests run `31147294296`.',
              '- The branch comparison contains only the 13 intended P16-S1 source, test, and governing-document files. No temporary workflow or migration change remains.',
              '- Automated acceptance is complete. The owner desktop checklist in `doc/P16-S1-atomic-monthly-depreciation-user-testing.md` remains required before merge.',
              '',
              'Next exact action:',
              '',
              '- Complete the owner desktop checklist on draft PR #252. If accepted, record owner approval and await explicit merge authorization. Do not merge or start P16-S2 without authorization.',
              '',
              '## P16-S2 — Atomic COA CSV accepted-row commit',
          ])
          replacements = {**simple, old_header: new_header, old_tail: new_tail}
          updated = source
          for before, after in replacements.items():
              count = updated.count(before)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {before!r}; found {count}')
              updated = updated.replace(before, after)
          path.write_text(updated, encoding='utf-8')
      - name: Commit handoff and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/p16-s1-plan-finalize.yml
          git add doc/PLAN.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: record P16-S1 verification handoff"
          git push origin HEAD:codex/P16-S1-atomic-monthly-depreciation
