name: P16-S3 provenance correction retry

on:
  push:
    branches:
      - codex/P16-S3-reconciliation-mutation-integrity

permissions:
  contents: write

jobs:
  apply-correction:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/P16-S3-reconciliation-mutation-integrity
          fetch-depth: 0
      - name: Reapply validated correction
        shell: bash
        run: |
          sed -n "/^[[:space:]]*python - <<'PY'$/,/^[[:space:]]*PY$/p" .github/workflows/p16s3-correct-provenance.yml \
            | sed -e '1d;$d' -e 's/^          //' > /tmp/p16s3-apply.py
          python /tmp/p16s3-apply.py
          sed -i 's/^Pull request: #254  $/Pull request: #254/' doc/PLAN.md
          sed -i 's/^Starting base: `100644b84c6bcb799446374aa928e953085255dd`  $/Starting base: `100644b84c6bcb799446374aa928e953085255dd`/' doc/PLAN.md
      - name: Commit correction and clean helper workflows
        shell: bash
        run: |
          rm .github/workflows/p16s3-correct-provenance.yml
          rm .github/workflows/p16s3-provenance-retry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix reconciliation import provenance boundary"
          git push origin HEAD:codex/P16-S3-reconciliation-mutation-integrity
