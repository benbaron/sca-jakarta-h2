name: P22 PLAN Publisher

on:
  push:
    branches: [codex/P22-S1-plan-publisher]
    paths: [.github/workflows/p22-plan-publisher.yml]

permissions:
  contents: write

jobs:
  publish-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified P22 PLAN amendment
        shell: bash
        env:
          PATCH_GZ_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_GZ_B64" | base64 -d | gzip -dc > /tmp/plan.patch
          git apply --check /tmp/plan.patch
          git apply /tmp/plan.patch
          test "$(git hash-object doc/PLAN.md)" = "a7d302da7e82de906f96798f5045dd3488d0468a"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/PLAN.md
          git commit -m "P22-S1: record Dashboard validation"
          git push origin HEAD:codex/P22-S1-plan-publisher
