name: Temporary P15-S4 fixed-assets SCLX publication

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.pull_request.head.ref == 'codex/P15-S4-fixed-assets-sclx-mapping' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fixed-assets SCLX branch
        uses: actions/checkout@v4
        with:
          ref: codex/P15-S4-fixed-assets-sclx-mapping
          fetch-depth: 0
      - name: Verify chunks, apply reviewed implementation, and remove publication artifacts
        shell: bash
        run: |
          set -euo pipefail
          echo '53057913c74bb780717fb657ac393e1716f12d06276c306256b45d99f501f309  .p15-publish/fixed-assets-sclx-00.txt' | sha256sum --check
          echo '4d82af3b2bdec9dbf0ba914acc09bf82a7484dc078162f326d98eb7953498e58  .p15-publish/fixed-assets-sclx-01.txt' | sha256sum --check
          echo '0c365d327cccd393b2ab06a4ad1c83638708352340849c20381b31a676783d6a  .p15-publish/fixed-assets-sclx-02.txt' | sha256sum --check
          echo '64f2fd2d1660aa1ff592e0ae238b6ad7de1c7d5b635e8ef34b6f3b6f47eaf6bc  .p15-publish/fixed-assets-sclx-03.txt' | sha256sum --check
          echo 'db49a61024eb028139a75f778636cd6b51223bf632de8aa692e5d1fb8d364bc5  .p15-publish/fixed-assets-sclx-04.txt' | sha256sum --check
          echo 'ca7eaeadad26e490539f51f22d9ce6d595c16e840796707645c5d4ddfea5d691  .p15-publish/fixed-assets-sclx-05.txt' | sha256sum --check
          echo '81a0457f4dc88faef4feef1bf420ffc83f49d87e0f0f4e2b6497ce6bf5969146  .p15-publish/fixed-assets-sclx-06.txt' | sha256sum --check
          cat .p15-publish/fixed-assets-sclx-*.txt \
            | tr -d '\n\r' \
            | base64 --decode \
            | gzip --decompress > /tmp/fixed-assets-sclx.patch
          echo '7785e22f36d5d081ad6265e895a1919599b611ef2a19c1eb61eeb9cbe52bcd35  /tmp/fixed-assets-sclx.patch' \
            | sha256sum --check
          git apply --check /tmp/fixed-assets-sclx.patch
          git apply /tmp/fixed-assets-sclx.patch
          git rm .p15-publish/fixed-assets-sclx-00.txt \
                 .p15-publish/fixed-assets-sclx-01.txt \
                 .p15-publish/fixed-assets-sclx-02.txt \
                 .p15-publish/fixed-assets-sclx-03.txt \
                 .p15-publish/fixed-assets-sclx-04.txt \
                 .p15-publish/fixed-assets-sclx-05.txt \
                 .p15-publish/fixed-assets-sclx-06.txt \
                 .github/workflows/temporary-p15-s4-fixed-assets-sclx.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add doc/P15-S4-sclx-export-ui-user-testing.md \
                  doc/data-exchange/sclx.md \
                  doc/interface-operation-matrix.md \
                  src/main/java/org/nonprofitbookkeeping/interchange/sclx/SclxCoreSnapshotAssembler.java \
                  src/main/java/org/nonprofitbookkeeping/interchange/sclx/SclxCoreSnapshotQueryService.java \
                  src/main/java/org/nonprofitbookkeeping/interchange/sclx/SclxExportCounts.java \
                  src/main/java/org/nonprofitbookkeeping/interchange/sclx/SclxExportDocumentValidator.java \
                  src/main/java/org/nonprofitbookkeeping/interchange/sclx/SclxExportSection.java \
                  src/main/java/org/nonprofitbookkeeping/interchange/sclx/SclxFixedAssetSnapshot.java \
                  src/main/java/org/nonprofitbookkeeping/interchange/sclx/SclxFixedAssetSnapshotAssembler.java \
                  src/main/java/org/nonprofitbookkeeping/interchange/sclx/SclxFixedAssetSnapshotQuery.java \
                  src/main/java/org/nonprofitbookkeeping/interchange/sclx/SclxFixedAssetsExtension.java \
                  src/main/java/org/nonprofitbookkeeping/interchange/sclx/SclxPortableIdentity.java \
                  src/main/java/org/nonprofitbookkeeping/ui/SclxExportCoordinator.java \
                  src/test/java/org/nonprofitbookkeeping/interchange/sclx/SclxExportSectionTest.java \
                  src/test/java/org/nonprofitbookkeeping/interchange/sclx/SclxFileExportServiceTest.java \
                  src/test/java/org/nonprofitbookkeeping/interchange/sclx/SclxFixedAssetSnapshotQueryServiceTest.java \
                  src/test/java/org/nonprofitbookkeeping/interchange/sclx/SclxFixedAssetSnapshotTest.java \
                  src/test/java/org/nonprofitbookkeeping/interchange/sclx/SclxJsonSerializerTest.java \
                  src/test/java/org/nonprofitbookkeeping/interchange/sclx/SclxPortableIdentityTest.java \
                  src/test/java/org/nonprofitbookkeeping/ui/SclxExportCoordinatorTest.java
          git commit -m 'Export selected-company fixed assets to SCLX'
          git push
