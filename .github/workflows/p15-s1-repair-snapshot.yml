name: P15-S1 Repair Snapshot

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: codex/P15-S1-repair
          fetch-depth: 0
      - name: Create exact branch archive
        run: tar -czf /tmp/p15-s1-repair-main.tgz --exclude=.git .
      - name: Upload branch archive
        uses: actions/upload-artifact@v4
        with:
          name: p15-s1-repair-main
          path: /tmp/p15-s1-repair-main.tgz
          if-no-files-found: error
          retention-days: 1
