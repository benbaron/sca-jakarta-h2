name: Temporary P15-S4 fixed-asset identity publication

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.pull_request.head.ref == 'codex/P15-S4-fixed-asset-portable-identities' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fixed-asset identity branch
        uses: actions/checkout@v4
        with:
          ref: codex/P15-S4-fixed-asset-portable-identities
          fetch-depth: 0
      - name: Apply reviewed implementation and remove publication artifacts
        shell: bash
        run: |
          set -euo pipefail
          cat .p15-publish/fixed-asset-identities-*.txt \
            | tr -d '\n\r' \
            | base64 --decode \
            | gzip --decompress > /tmp/fixed-asset-identities.patch
          echo 'b00dc0f8b3d8340cccdeecfaebd96e232bf4b78e5ebd0fc2a3984ecb632bcf47  /tmp/fixed-asset-identities.patch' \
            | sha256sum --check
          git apply --check /tmp/fixed-asset-identities.patch
          git apply /tmp/fixed-asset-identities.patch
          git rm .p15-publish/fixed-asset-identities-01.txt \
                 .p15-publish/fixed-asset-identities-02.txt \
                 .github/workflows/temporary-p15-s4-fixed-asset-identities.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add doc/P15-S4-sclx-export-ui-user-testing.md \
                  doc/data-exchange/sclx.md \
                  doc/data-exchange/shared-operation-contract.md \
                  src/main/java/org/nonprofitbookkeeping/model/FixedAsset.java \
                  src/main/java/org/nonprofitbookkeeping/model/FixedAssetDepreciationRun.java \
                  src/main/resources/db/migration/V65__fixed_asset_portable_identity.sql \
                  src/test/java/org/nonprofitbookkeeping/model/FixedAssetPortableIdentityTest.java \
                  src/test/java/org/nonprofitbookkeeping/persistence/FixedAssetPortableIdentityMigrationTest.java
          git commit -m 'Add durable fixed-asset portable identities'
          git push
