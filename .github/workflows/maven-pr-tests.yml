name: Maven PR Tests

on:
  pull_request:
    branches: [ "**" ]
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: maven-pr-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish repository source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: repository-source-${{ github.sha }}
          path: |
            .
            !.git/**
            !target/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run rendered theme text contrast regression
        run: |
          if ! xvfb-run -a mvn -B -ntp -e -Dtest=JavaFxRenderingPolicyTest,TextContrastPolicyTest,ThemeTextContrastFxTest,ApplicationPresentationFxTest,ProductionPanelRouteComplianceTest test --settings .mvn/settings-github.xml -Dmaven.repo.local=$HOME/.m2/repository > theme-regression.log 2>&1; then
            tail -n 120 theme-regression.log
            exit 1
          fi
          tail -n 12 theme-regression.log

      - name: Run clean headless verification
        env:
          DISPLAY: ""
        run: mvn -B -ntp -e clean verify --settings .mvn/settings-github.xml -Dmaven.repo.local=$HOME/.m2/repository

      - name: Run tests
        run: mvn -B -ntp -e test --settings .mvn/settings-github.xml -Dmaven.repo.local=$HOME/.m2/repository

      - name: Run period close state behavior
        run: xvfb-run -a mvn -B -ntp -e -Dtest=PeriodCloseStatePanelTest test --settings .mvn/settings-github.xml -Dmaven.repo.local=$HOME/.m2/repository

      - name: Run local overflow and wrapping behavior
        run: xvfb-run -a mvn -B -ntp -e -Dtest=PanelOverflowTest test --settings .mvn/settings-github.xml -Dmaven.repo.local=$HOME/.m2/repository

      - name: Run Import workflows and task lifecycle
        run: xvfb-run -a mvn -B -ntp -e -DreuseForks=false -Dtest=ImportWorkflowPanelTest,ImportPreviewPanelSclxTest,InterchangeTaskControllerTest test --settings .mvn/settings-github.xml -Dmaven.repo.local=$HOME/.m2/repository

      - name: Run production JavaFX route compliance
        run: xvfb-run -a mvn -B -ntp -e -Dtest=WorkflowPeriodDefaultsTest,PeriodConsistencyPanelTest,ReportLibraryPeriodSynchronizationIntegrationTest,JournalSupplementalAvailabilityTest,WindowsMenuStylerTest,PanelViewportFxTest,NavigationPaneInteractionTest,CloseReviewEvidencePaneTest,AccountingReadinessPaneTest,CorePacketExportActionTest,AssetAcquisitionPanelTest,RecognitionAssistantPanelTest,OpeningConversionPanelTest,MerchantSettlementAssistantPanelTest,DatabaseTransferPanelTest,DatabaseTransferMenuInstallerTest,CompanyTableStateBinderTest,ProductionPanelRouteComplianceTest,CoreEditorComplianceTest,ChartOfAccountsInterchangePanelTest,FormattedReportFxRendererTest,EventDiscoveryPanelTest,JournalFundEventTaggingTest,InventoryEventAttributionPanelTest,BudgetCategoriesPanelTest,BudgetPlanningPanelTest,CounterpartiesPanelTest,MerchantsPanelTest,FundTransfersPanelTest,JournalPaymentReferencesTest,CheckExceptionsPaneTest,PaneSaveCoverageTest,NmrPoliciesPanelTest,AppPanelCommandCapabilityTest,ProductionWorkspaceCommandRoutingTest,ThemeTextContrastFxTest,ApplicationPresentationFxTest test --settings .mvn/settings-github.xml -Dmaven.repo.local=$HOME/.m2/repository

      - name: Summarize failed tests
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          def escape(message):
              return message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')

          failures = 0
          for report in sorted(Path('target/surefire-reports').glob('TEST-*.xml')):
              for case in ET.parse(report).getroot().iter('testcase'):
                  for kind in ('failure', 'error'):
                      issue = case.find(kind)
                      if issue is None:
                          continue
                      name = case.get('classname', '') + '.' + case.get('name', '')
                      message = issue.get('message') or issue.text or kind
                      print('::error::' + escape(name + ': ' + message[:3000]))
                      failures += 1
          if not failures:
              print('No Surefire assertion/error records; inspect the failed build step.')
          PY

      - name: Publish failed test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-test-reports-${{ github.sha }}
          path: target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 7

  windows-presentation:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify Windows startup and contrast with production rendering policy
        shell: pwsh
        run: mvn -B -ntp "-Dtest=JavaFxRenderingPolicyTest,ApplicationPresentationFxTest,ThemeTextContrastFxTest,WindowsMenuStylerTest,PanelViewportFxTest,JournalSupplementalAvailabilityTest" test --settings .mvn/settings-github.xml "-Dmaven.repo.local=$env:USERPROFILE/.m2/repository"
      - name: Require executed Windows display tests
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem target/surefire-reports/TEST-*.xml)
          if ($reports.Count -ne 6) { throw "Expected six Windows regression reports." }
          foreach ($report in $reports) {
            [xml]$suite = Get-Content $report.FullName
            if ([int]$suite.testsuite.tests -lt 1 -or [int]$suite.testsuite.skipped -gt 0) {
              throw "Windows regression did not execute: $($report.Name)"
            }
          }
      - name: Publish Windows test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-reports-${{ github.sha }}
          path: target/surefire-reports/**
          if-no-files-found: warn
