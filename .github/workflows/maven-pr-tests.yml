name: Maven PR Tests

on:
  pull_request:
    branches: [ "**" ]
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: maven-pr-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Capture headless test failure
        id: headless
        env:
          DISPLAY: ""
        shell: bash
        run: |
          set +e
          mvn -B -ntp -e test --settings .mvn/settings.xml -Dmaven.repo.local=$HOME/.m2/repository > maven-full.log 2>&1
          result=$?
          tail -n 180 maven-full.log > maven-tail.txt
          echo "result=$result" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Maven diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p15-s3-maven-tail
          path: maven-tail.txt
          retention-days: 1

      - name: Fail when headless tests failed
        if: steps.headless.outputs.result != '0'
        run: exit 1

      - name: Run tests
        run: mvn -B -ntp -e test --settings .mvn/settings.xml -Dmaven.repo.local=$HOME/.m2/repository

      - name: Run production JavaFX route compliance
        run: xvfb-run -a mvn -B -ntp -e -Dtest=DatabaseTransferPanelTest,DatabaseTransferMenuInstallerTest,CompanyTableStateBinderTest,ProductionPanelRouteComplianceTest,CoreEditorComplianceTest,ChartOfAccountsInterchangePanelTest test --settings .mvn/settings.xml -Dmaven.repo.local=$HOME/.m2/repository
