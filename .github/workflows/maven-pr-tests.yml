name: Maven PR Tests

on:
  pull_request:
    branches: [ "**" ]
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maven-pr-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Canonicalize MainWindow Journal routes
        shell: bash
        run: |
          python3 .github/scripts/patch_main_window_journal.py
          if git diff --quiet -- src/main/java/org/nonprofitbookkeeping/ui/MainWindow.java; then
            echo "No MainWindow commit required."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/main/java/org/nonprofitbookkeeping/ui/MainWindow.java
            git commit -m "Canonicalize MainWindow Journal routes"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Run tests
        run: mvn -B -ntp -e test --settings .mvn/settings.xml -Dmaven.repo.local=$HOME/.m2/repository
