name: Maven PR Tests

on:
  pull_request:
    branches: [ "**" ]
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maven-pr-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Canonicalize MainWindow Journal routes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/main/java/org/nonprofitbookkeeping/ui/MainWindow.java")
          text = path.read_text(encoding="utf-8")
          if "if (id == AppPanelId.SCHEDULES || AppPanelId.canonical(id) != id)" in text:
              print("MainWindow Journal routes are already canonicalized.")
              raise SystemExit(0)

          text = text.replace(
              "        openPanel(AppPanelId.LEDGER_REGISTER);",
              "        openPanel(AppPanelId.JOURNAL_PANE);",
              1)

          text, count = re.subn(
              r'''(?s)    static List<PaletteEntry> commandPaletteEntriesForTests\(\)\n    \{.*?\n    \}\n\n\n    private NavigationPane\.InspectorContext''',
              '''    static List<PaletteEntry> commandPaletteEntriesForTests()
    {
        List<PaletteEntry> entries = new ArrayList<>();
        for (AppPanelId id : AppPanelId.values())
        {
            if (id == AppPanelId.SCHEDULES || AppPanelId.canonical(id) != id)
            {
                continue;
            }
            entries.add(new PaletteEntry(id, panelLabel(id)));
        }
        entries.sort(Comparator.comparing(PaletteEntry::label));
        return entries;
    }


    private NavigationPane.InspectorContext''',
              text,
              count=1)
          if count != 1:
              raise SystemExit("Could not replace commandPaletteEntriesForTests")

          text, count = re.subn(
              r'''(?s)    static String panelCapabilities\(AppPanelId id\)\n    \{.*?\n    \}\n\n    static UserPrivilegeLevel''',
              '''    static String panelCapabilities(AppPanelId id)
    {
        AppPanelId canonicalId = AppPanelId.canonical(id);
        return switch (canonicalId)
        {
            case JOURNAL_PANE -> "Grouped journal review, New/Edit/Save, Delete/Reverse, validation, and supplemental details";
            case IMPORT_PREVIEW -> "Import review and preview workflow";
            case APPROVAL_AUDIT -> "Factual audit filters by workflow/decision/actor/date; run-id visibility";
            case IMPORT_EXPORT_JOBS -> "Unified import/export job history and error tracking";
            case BANK_TRANSACTIONS -> "Imported bank transactions, drill to ledger, export selected";
            case SETTINGS -> "Preferences management";
            case DIAGNOSTICS -> "Health checks and duplicate-code diagnostics";
            default -> "Open panel, inspect context, panel-local actions";
        };
    }

    static UserPrivilegeLevel''',
              text,
              count=1)
          if count != 1:
              raise SystemExit("Could not replace panelCapabilities")

          text, count = re.subn(
              r'''(?s)    private static String panelLabel\(AppPanelId id\)\n    \{.*?\n    \}\n\n    void saveViewPresetForTests''',
              '''    private static String panelLabel(AppPanelId id)
    {
        return switch (id)
        {
            case DASHBOARD -> "Dashboard";
            case LEDGER_REGISTER, TXN_EDITOR, JOURNAL_PANE -> "Journal";
            case BANKING -> "Banking";
            case SCHEDULES -> "Retired Schedules";
            case BUDGET_EDITOR -> "Budget Editor";
            case BUDGET_VS_ACTUAL -> "Budget vs Actual";
            case ASSETS_REGISTER -> "Asset Register";
            case DEPRECIATION_RUNS -> "Depreciation Runs";
            case INVENTORY -> "Inventory";
            case RECONCILIATION_RUNS -> "Reconciliation Runs";
            case PERIOD_CLOSE_RUNS -> "Period Close Runs";
            case IMPORT_PREVIEW -> "Import Preview";
            case APPROVAL_AUDIT -> "Audit History";
            case IMPORT_EXPORT_JOBS -> "Import / Export Jobs";
            case BANK_TRANSACTIONS -> "Bank Transactions";
            case REPORT_LIBRARY -> "Reports Library";
            case CHART_OF_ACCOUNTS -> "Chart of Accounts";
            case FUNDS -> "Funds";
            case SETTINGS -> "Settings";
            case DIAGNOSTICS -> "Diagnostics";
            case HELP -> "Help";
        };
    }

    void saveViewPresetForTests''',
              text,
              count=1)
          if count != 1:
              raise SystemExit("Could not replace panelLabel")

          old_preset = "                AppPanelId panelId = AppPanelId.valueOf(state.panelId());"
          if text.count(old_preset) != 1:
              raise SystemExit("Could not find persisted preset panel id")
          text = text.replace(
              old_preset,
              "                AppPanelId panelId = AppPanelId.canonical(AppPanelId.valueOf(state.panelId()));",
              1)

          text, count = re.subn(
              r'''(?s)    public void openPanel\(AppPanelId id\)\n    \{.*?\n    \}\n\n    public void openInspectorForSelection''',
              '''    public void openPanel(AppPanelId id)
    {
        AppPanelId canonicalId = AppPanelId.canonical(id);
        UserPrivilegeLevel privilege = SESSION_STATE.preferences().defaultPrivilege();
        if (!canAccessPanelForPrivilege(canonicalId, privilege))
        {
            info("Access denied: " + panelLabel(canonicalId) + " requires " + requiredPrivilegeForPanel(canonicalId) + " privilege.");
            return;
        }
        panelHost.show(canonicalId);
        nav.highlight(canonicalId);
        if (activePanelLabel != null)
        {
            activePanelLabel.setText("Panel: " + panelHost.getActiveTitle());
        }
    }

    public void openInspectorForSelection''',
              text,
              count=1)
          if count != 1:
              raise SystemExit("Could not replace openPanel")

          text, count = re.subn(
              r'''(?s)    public void openInspectorJournal\(\)\n    \{.*?\n    \}\n\n    String buildJournalInspectorPreviewForTests''',
              '''    public void openInspectorJournal()
    {
        Optional<AppPanel.JournalSelection> selected = panelHost.activeJournalSelection();
        if (selected.isPresent())
        {
            DrillThroughCoordinator.openPanelWithContext(
                    AppPanelId.JOURNAL_PANE,
                    "Txn #" + selected.get().txnId());
        }
        else
        {
            openPanel(AppPanelId.JOURNAL_PANE);
        }
    }

    String buildJournalInspectorPreviewForTests''',
              text,
              count=1)
          if count != 1:
              raise SystemExit("Could not replace openInspectorJournal")

          path.write_text(text, encoding="utf-8")
          PY

          if git diff --quiet -- src/main/java/org/nonprofitbookkeeping/ui/MainWindow.java; then
            echo "No MainWindow commit required."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/main/java/org/nonprofitbookkeeping/ui/MainWindow.java
            git commit -m "Canonicalize MainWindow Journal routes"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Run tests
        run: mvn -B -ntp -e test --settings .mvn/settings.xml -Dmaven.repo.local=$HOME/.m2/repository
