name: Maven PR Tests

on:
  pull_request:
    branches: [ "**" ]
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: maven-pr-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Clear Maven cache (if needed)
        run: rm -rf $HOME/.m2/repository

      - name: Run headless tests
        env:
          DISPLAY: ""
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp -e clean test --settings .mvn/settings.xml -Dmaven.repo.local=$HOME/.m2/repository 2>&1 | tail -n 120

      - name: Run tests
        run: mvn -B -ntp -e test --settings .mvn/settings.xml -Dmaven.repo.local=$HOME/.m2/repository

      - name: Run production JavaFX route compliance
        run: xvfb-run -a mvn -B -ntp -e -Dtest=DatabaseTransferPanelTest,DatabaseTransferMenuInstallerTest,CompanyTableStateBinderTest,ProductionPanelRouteComplianceTest,CoreEditorComplianceTest test --settings .mvn/settings.xml -Dmaven.repo.local=$HOME/.m2/repository
