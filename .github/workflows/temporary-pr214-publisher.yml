name: Temporary PR214 publisher diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ github.event.pull_request.head.ref == 'codex/P15-S4-banking-portable-identities' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout banking identity branch
        uses: actions/checkout@v4
        with:
          ref: codex/P15-S4-banking-portable-identities
          fetch-depth: 0
      - name: Capture publisher diagnostics
        shell: bash
        run: |
          set +e
          {
            echo "encoded expected 54c96f135cbfaccf930e039cd7c851b4564a446dd6f4f0aa8a207e6d88892489"
            sha256sum .p15-publish/pr214.diff.gz.b64
            base64 -d .p15-publish/pr214.diff.gz.b64 > /tmp/pr214.diff.gz
            echo "decode status $?"
            echo "gzip expected df1b530d7a9635903eb0189483cb35ee36ccd75d3ac3eb2c3e4bcc901cae5338"
            sha256sum /tmp/pr214.diff.gz
            gzip -dc /tmp/pr214.diff.gz > /tmp/pr214.diff
            echo "gunzip status $?"
            echo "diff expected 58a09bb477d16e318aaa6a1536dd4f4d535744eec6274375e28ce53d89c66991"
            sha256sum /tmp/pr214.diff
            echo "patch dry run"
            patch --dry-run --batch --forward -p1 < /tmp/pr214.diff
            echo "patch status $?"
          } > pr214-publisher-diagnostic.log 2>&1
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pr214-publisher-diagnostic.log
          git commit -m "diagnose PR214 publisher" || exit 0
          git push
