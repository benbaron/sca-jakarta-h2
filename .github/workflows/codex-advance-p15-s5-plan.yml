name: Advance P15-S5 plan state

on:
  push:
    branches:
      - codex/P15-S5-sclx-import-preview
    paths:
      - .codex/advance_p15_s5_plan.py
      - .github/workflows/codex-advance-p15-s5-plan.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  advance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/P15-S5-sclx-import-preview
          fetch-depth: 0
      - name: Resolve open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: codex/P15-S5-sclx-import-preview
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          url = f"https://api.github.com/repos/{os.environ['REPOSITORY']}/pulls?state=open&head=benbaron:{os.environ['BRANCH']}"
          request = urllib.request.Request(url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(request) as response:
              pulls = json.load(response)
          if len(pulls) != 1:
              raise SystemExit(f"Expected one open PR for branch; found {len(pulls)}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"PR_NUMBER={pulls[0]['number']}\n")
          PY
      - name: Reconcile plan
        run: python .codex/advance_p15_s5_plan.py
      - name: Remove transition helpers
        run: rm -f .codex/advance_p15_s5_plan.py .github/workflows/codex-advance-p15-s5-plan.yml
      - name: Commit plan transition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Advance P15 plan to SCLX import preview"
          git push origin HEAD:codex/P15-S5-sclx-import-preview

