name: Temporary PR209 plan reconciliation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ github.event.pull_request.head.ref == 'codex/P15-S4-sclx-export-ui' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/P15-S4-sclx-export-ui
          fetch-depth: 0
      - name: Reconcile execution ledger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('doc/PLAN.md')
          text = path.read_text()
          if 'plan_version: 84' in text:
              raise SystemExit(0)
          replacements = [
              ('plan_version: 83', 'plan_version: 84'),
              ('active_branch: codex/P15-S4-sclx-deterministic-file-export', 'active_branch: codex/P15-S4-sclx-export-ui'),
              ('active_pull_request: 208', 'active_pull_request: 209'),
              ('active_head: "43b6ada84f7531d7e235aac4d0ac6b7f9ae60ffb"', 'active_head: "18aac1b988a6604521e7d3f1e59bc310dd34a7fd"'),
              ('next_action: "Validate and merge PR #208, then continue P15-S4 with additional selected-company sections and production JavaFX export wiring on a fresh branch."', 'next_action: "Validate and merge PR #209, then continue P15-S4 with the remaining governed selected-company section mappings on a fresh branch."'),
              ('This revision records merged selected-company financial snapshot mapping through PR #207 and deterministic atomic SCLX file export in draft PR #208.', 'This revision records deterministic atomic SCLX file export merged through PR #208 and the production selected-company File-menu export route in draft PR #209.'),
              ('Status: VERIFYING on branch `codex/P15-S4-sclx-deterministic-file-export` in draft PR #208.', 'Status: VERIFYING on branch `codex/P15-S4-sclx-export-ui` in draft PR #209.'),
              ('Current tested implementation head: `43b6ada84f7531d7e235aac4d0ac6b7f9ae60ffb`', 'Current tested implementation head: `18aac1b988a6604521e7d3f1e59bc310dd34a7fd`'),
              ('- PR #208: deterministic Jackson tree serialization, guarded same-directory atomic file replacement, overwrite/path/active-database protections, SHA-256, entity counts, deferred-section warnings, and explicit exclusions.', '- PR #208: deterministic Jackson tree serialization, guarded same-directory atomic file replacement, overwrite/path/active-database protections, SHA-256, entity counts, deferred-section warnings, and explicit exclusions.\n- PR #209: production File-menu selected-company SCLX export with frozen company/database scope, asynchronous execution, explicit overwrite confirmation, exact counts/hash/warnings/exclusions presentation, route tests, and desktop acceptance instructions.'),
              ('- PRs #198 through #207 are merged.', '- PRs #198 through #208 are merged.'),
              ('- Maven PR Tests run `30236206639` passed on clean implementation head `43b6ada84f7531d7e235aac4d0ac6b7f9ae60ffb`, including `mvn clean verify`, the repeated test suite, and JavaFX production-route compliance.', '- Maven PR Tests run `30236206639` passed on clean implementation head `43b6ada84f7531d7e235aac4d0ac6b7f9ae60ffb`, including `mvn clean verify`, the repeated test suite, and JavaFX production-route compliance.\n- Final PR #208 run `30236397436` passed on plan-inclusive head `dfa7a25db3f89eee99b3a478137ac02ca1ad2520`; PR #208 merged at `96004c909192d663cdc168de35b871ca241bca66`.\n- Initial clean PR #209 run `30238993416` exposed an invalid indexed JavaFX `ObservableList.addAll` overload in the fallback File-menu insertion; the implementation was corrected to the established indexed `List.of(...)` form.\n- Focused PR #209 run `30239143008` passed 8 tests with 0 failures and 0 errors after the correction; 4 display-dependent cases were skipped because that focused diagnostic did not install Xvfb.\n- Maven PR Tests run `30239221873` passed on clean implementation head `18aac1b988a6604521e7d3f1e59bc310dd34a7fd`, including `mvn clean verify`, the repeated test suite, and JavaFX production-route compliance under Xvfb.'),
              ('- Validate and merge PR #208, then start a fresh P15-S4 branch for additional governed selected-company section mapping and production JavaFX export wiring/result presentation.', '- Validate and merge PR #209, then start a fresh P15-S4 branch for the remaining governed selected-company section mappings; complete owner desktop acceptance before P15-S4 is marked done.'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing PLAN.md text: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          if git diff --quiet -- doc/PLAN.md; then
            echo "PLAN.md is already reconciled."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add doc/PLAN.md
          git commit -m "Reconcile P15 plan for PR209"
          git push
