name: P15 Inventory Fix Optional Fields

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'codex/P15-S4-C3-inventory-sclx-export'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/P15-S4-C3-inventory-sclx-export
          fetch-depth: 0
      - name: Allow omitted optional extension fields
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/main/java/org/nonprofitbookkeeping/interchange/sclx/SclxExtensionValueReader.java')
          text = path.read_text()
          old = '            if (!map.keySet().equals(keys))\n'
          new = '            if (!keys.containsAll(map.keySet()))\n'
          if old not in text:
              raise SystemExit('strict key comparison not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/p15-inventory-fix-optional-fields.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Allow omitted optional SCLX extension fields'
          git push origin HEAD:codex/P15-S4-C3-inventory-sclx-export
