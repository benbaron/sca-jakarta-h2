name: Capture P03-C7 Maven diagnostics

on:
  pull_request:
    branches: [ "main" ]
    types: [ synchronize ]

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Maven and capture output
        shell: bash
        run: |
          set +e
          mvn -Djava.awt.headless=true -Dtestfx.headless=true clean test > /tmp/p03-c7-maven.log 2>&1
          status=$?
          echo "$status" > /tmp/p03-c7-maven-status
          exit 0

      - name: Upload Maven diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p03-c7-maven-diagnostics
          path: |
            /tmp/p03-c7-maven.log
            /tmp/p03-c7-maven-status

      - name: Preserve Maven result
        if: always()
        run: |
          tail -80 /tmp/p03-c7-maven.log
          test "$(cat /tmp/p03-c7-maven-status)" = "0"
