name: Temporary PR206 Maven diagnostic

on:
  push:
    branches:
      - codex/P15-S4-sclx-transaction-portable-id

permissions:
  contents: write

jobs:
  capture:
    if: ${{ !contains(github.event.head_commit.message, 'Capture PR 206 Maven diagnostic') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Capture clean verification
        shell: bash
        run: |
          set +e
          mvn -B -ntp -e clean verify --settings .mvn/settings-github.xml -Dmaven.repo.local=$HOME/.m2/repository > pr206-maven-diagnostic.log 2>&1
          status=$?
          echo "MAVEN_EXIT_CODE=$status" >> pr206-maven-diagnostic.log
          tail -n 300 pr206-maven-diagnostic.log > pr206-maven-diagnostic-tail.log
          exit 0

      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pr206-maven-diagnostic.log pr206-maven-diagnostic-tail.log
          git commit -m "Capture PR 206 Maven diagnostic"
          git push
