name: P15-S1 Source Snapshot

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout P15-S1 branch
        uses: actions/checkout@v4
        with:
          ref: codex/P15-S1-company-ownership
          fetch-depth: 0
      - name: Create source archive
        run: |
          git reset --hard e5dbf79e4b60c26dcd35d1016ffef66096c35a15
          git clean -fdx
          tar -czf /tmp/sca-jakarta-h2-main.tgz --exclude=.git .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: p15-s1-source
          path: /tmp/sca-jakarta-h2-main.tgz
          if-no-files-found: error
          retention-days: 1

  tooling:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: e5dbf79e4b60c26dcd35d1016ffef66096c35a15
      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Resolve compile and test dependencies
        run: mvn -B -ntp -DskipTests test-compile --settings .mvn/settings.xml -Dmaven.repo.local=$HOME/.m2/repository
      - name: Stage portable Maven cache
        run: |
          mkdir -p /tmp/p15-s1-tooling/maven /tmp/p15-s1-tooling/m2
          cp -a /usr/share/apache-maven/. /tmp/p15-s1-tooling/maven/
          cp -a "$HOME/.m2/repository"/. /tmp/p15-s1-tooling/m2/
          tar -C /tmp -czf /tmp/p15-s1-tooling.tgz p15-s1-tooling
      - name: Upload tooling archive
        uses: actions/upload-artifact@v4
        with:
          name: p15-s1-tooling
          path: /tmp/p15-s1-tooling.tgz
          if-no-files-found: error
          retention-days: 1
