name: Temporary P17-C5 Maven verification

on:
  push:
    branches:
      - codex/P17-C5-inventory-item-lifecycle

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run clean headless verification
        env:
          DISPLAY: ""
        run: mvn -B -ntp -e clean verify --settings .mvn/settings-github.xml -Dmaven.repo.local=$HOME/.m2/repository
      - name: Run tests
        run: mvn -B -ntp -e test --settings .mvn/settings-github.xml -Dmaven.repo.local=$HOME/.m2/repository
      - name: Run production JavaFX route compliance
        run: xvfb-run -a mvn -B -ntp -e -Dtest=DatabaseTransferPanelTest,DatabaseTransferMenuInstallerTest,CompanyTableStateBinderTest,ProductionPanelRouteComplianceTest,CoreEditorComplianceTest,ChartOfAccountsInterchangePanelTest test --settings .mvn/settings-github.xml -Dmaven.repo.local=$HOME/.m2/repository
