name: P20-S3 actor PLAN finalizer

on:
  push:
    branches:
      - codex/P20-S3-authenticated-audit-actor

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record exact-head actor CI evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('doc/PLAN.md')
          s = p.read_text()
          replacements = [
              ('plan_version: 278', 'plan_version: 279'),
              ('active_status: IN_PROGRESS', 'active_status: VERIFYING'),
              ('active_pull_request: null', 'active_pull_request: 330'),
              ('active_head: 7f190a68fe37284440225d6b90edfb2afde669c3', 'active_head: d3667270f34bc971a87d887ae96141db5af0d900'),
              ('next_action: "Complete the focused authenticated-audit-actor tranche, reconcile production UI/source guardrails and governing documentation, publish a draft PR to main, validate Maven PR Tests on the exact final behavior/documentation head, and stop before merge for owner acceptance."', 'next_action: "Validate Maven PR Tests on the PLAN-only successor to PR #330 after recording the green behavior/documentation head d3667270f34bc971a87d887ae96141db5af0d900 (run 33807059790, job 100819950561), then stop before merge for owner desktop acceptance."'),
              ('- there is no schema or migration change.\n\nGoverning actor design: `doc/P20-S3-authenticated-audit-actor.md`.', '- there is no schema or migration change;\n- PR #330 behavior/documentation head `d3667270f34bc971a87d887ae96141db5af0d900` passed Maven PR Tests run `33807059790`, job `100819950561`: clean headless verification, repeated full Maven tests, and production JavaFX route compliance all succeeded.\n\nGoverning actor design: `doc/P20-S3-authenticated-audit-actor.md`.')
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'missing expected PLAN text: {old[:80]}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm .github/workflows/p20-s3-actor-plan-finalize.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "P20-S3: record authenticated actor validation"
          git push origin HEAD:codex/P20-S3-authenticated-audit-actor
