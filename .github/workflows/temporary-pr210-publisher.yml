name: Temporary PR210 activity publisher

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.pull_request.head.ref == 'codex/P15-S4-sclx-activities' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout activity branch
        uses: actions/checkout@v4
        with:
          ref: codex/P15-S4-sclx-activities
          fetch-depth: 0
      - name: Verify and publish reviewed activity mapping
        shell: bash
        run: |
          set -euo pipefail
          cat .p15-publish/pr210.part* > /tmp/pr210.b64
          echo "fb26caeacd17512435d249531b8a9739e911e761531aba283acea6b0c607ba40  /tmp/pr210.b64" | sha256sum -c -
          base64 -d /tmp/pr210.b64 > /tmp/pr210.tar.gz
          echo "59aa13cf973d57a956d79b0cf1814afce2a12751c546c4ef023d501a0fd1c297  /tmp/pr210.tar.gz" | sha256sum -c -
          tar -tzf /tmp/pr210.tar.gz
          tar -xzf /tmp/pr210.tar.gz
          rm -rf .p15-publish
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "P15-S4: export company activities in SCLX"
          git push
