name: Temporary PR213 plan reconciliation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ github.event.pull_request.head.ref == 'codex/P15-S4-sclx-supplemental-details' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout supplemental-detail branch
        uses: actions/checkout@v4
        with:
          ref: codex/P15-S4-sclx-supplemental-details
          fetch-depth: 0
      - name: Reconcile P15-S4 execution ledger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('doc/PLAN.md')
          text = path.read_text()
          replacements = [
              ('plan_version: 88', 'plan_version: 89'),
              ('active_branch: codex/P15-S4-sclx-parties', 'active_branch: codex/P15-S4-sclx-supplemental-details'),
              ('active_pull_request: 212', 'active_pull_request: 213'),
              ('active_head: "8364a1bd0abd8bc48f4673aa9e18bc28ebea5afc"',
               'active_head: "264942af84ea74c8882a374cec573d94fef617b5"'),
              ('next_action: "Validate and merge PR #212, then map selected-company supplemental transaction details into SCLX on a fresh P15-S4 branch."',
               'next_action: "Validate and merge PR #213, then map selected-company banking and reconciliation facts into SCLX on a fresh P15-S4 branch."'),
              ('This revision records durable Counterparty/Merchant portable identity merged through PR #211 and selected-company party export in draft PR #212.',
               'This revision records selected-company party export merged through PR #212 and supplemental transaction-detail export in draft PR #213.'),
              ('Status: VERIFYING on branch `codex/P15-S4-sclx-parties` in draft PR #212.',
               'Status: VERIFYING on branch `codex/P15-S4-sclx-supplemental-details` in draft PR #213.'),
              ('Current tested implementation head: `8364a1bd0abd8bc48f4673aa9e18bc28ebea5afc`',
               'Current tested implementation head: `264942af84ea74c8882a374cec573d94fef617b5`'),
              ('- PR #212: selected-company counterparty and merchant export, standard transaction-line payee references, deterministic line-level merchant links, strict ownership/reference validation, counts, inactive-row retention, and desktop acceptance updates.',
               '- PR #212: selected-company counterparty and merchant export, standard transaction-line payee references, deterministic line-level merchant links, strict ownership/reference validation, counts, inactive-row retention, and desktop acceptance updates.\n- PR #213: selected-company supplemental transaction-detail export, deterministic transaction-local identities, complete persisted field preservation, strict semantic/reference validation, counts, and desktop acceptance updates.'),
              ('- PRs #198 through #211 are merged.', '- PRs #198 through #212 are merged.'),
              ('- Clean PR #212 implementation run `30328268651` passed `mvn clean verify`, the repeated Maven test suite, and JavaFX production-route compliance on head `8364a1bd0abd8bc48f4673aa9e18bc28ebea5afc`.',
               '- Clean PR #212 implementation run `30328268651` passed `mvn clean verify`, the repeated Maven test suite, and JavaFX production-route compliance on head `8364a1bd0abd8bc48f4673aa9e18bc28ebea5afc`.\n- Final PR #212 run `30328459742` passed on artifact-free, plan-inclusive head `6bca1c6dfae8ad155af03458107b4645e7e6d68d`; PR #212 merged at `ab78c7faee8efe061c18375eef8518800fbec669`.\n- PR #213 contract, validator, assembler, query, and focused test sources passed bounded Java 17 syntax compilation before publication.\n- Clean PR #213 implementation run `30331172014` passed `mvn clean verify`, the repeated Maven test suite, and JavaFX production-route compliance on artifact-free head `264942af84ea74c8882a374cec573d94fef617b5`.'),
              ('- Validate and merge PR #212, then start a fresh P15-S4 branch to map selected-company supplemental transaction details; complete owner desktop acceptance before P15-S4 is marked done.',
               '- Validate and merge PR #213, then start a fresh P15-S4 branch to map selected-company banking and reconciliation facts; complete owner desktop acceptance before P15-S4 is marked done.')
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence, found {count}: {old[:120]}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add doc/PLAN.md
          git commit -m "Reconcile P15-S4 supplemental-detail plan"
          git push
