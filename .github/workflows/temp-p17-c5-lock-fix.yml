name: Temporary P17-C5 metadata-lock correction

on:
  push:
    branches:
      - codex/P17-C5-inventory-item-lifecycle

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify correction
        run: |
          python .tmp/p17_c5_lock_fix.py
          grep -q 'InventoryItem.class, itemId, LockModeType.PESSIMISTIC_WRITE' src/main/java/org/nonprofitbookkeeping/service/InventoryService.java
          test -f src/test/java/org/nonprofitbookkeeping/service/InventoryLifecycleSourceTest.java
          git diff --check
      - name: Publish correction and remove temporary artifacts
        run: |
          rm -f .tmp/p17_c5_lock_fix.py .github/workflows/temp-p17-c5-lock-fix.yml
          rmdir .tmp 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'P17-C5: serialize inventory metadata lifecycle writes'
          git push origin HEAD:codex/P17-C5-inventory-item-lifecycle
