name: P16-S5 plan validation record

on:
  push:
    branches:
      - codex/P16-S5-connected-database-session-authority
    paths:
      - .github/workflows/p16-s5-plan-validation.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout S5 branch
        uses: actions/checkout@v4
        with:
          ref: codex/P16-S5-connected-database-session-authority

      - name: Apply plan validation record
        shell: bash
        run: |
          set -euxo pipefail
          base64 -d .github/p16-s5-plan.patch.b64 | gzip -d > /tmp/plan.patch
          test "$(sha256sum /tmp/plan.patch | awk '{print $1}')" = "9b3d95e3bc662122d8f6cd63f0c2ec3a86405d792ade9ad2bc259a260c013f25"
          patch -p1 < /tmp/plan.patch
          rm .github/p16-s5-plan.patch.b64
          rm .github/workflows/p16-s5-plan-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record P16-S5 validation state"
          git push origin HEAD:codex/P16-S5-connected-database-session-authority
