name: Apply P17-C1-C1 CI state

on:
  push:
    branches:
      - codex/P17-C1-C1-plan-reconciliation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/P17-C1-C1-plan-reconciliation
          fetch-depth: 0

      - name: Record green PR CI and remove helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('doc/PLAN.md')
          s = path.read_text()

          replacements = [
              ('next_action: "Run Maven PR Tests on the exact final PR #293 head and stop before merge. P17-C1 remains VERIFYING until the owner explicitly accepts the desktop checklist."',
               'next_action: "Keep draft PR #293 unchanged after final green CI and stop before merge. P17-C1 remains VERIFYING until the owner explicitly accepts the desktop checklist."'),
              ('- Maven PR Tests are required on the exact final PR head; no local Maven result is claimed because the execution container cannot resolve GitHub and has no usable local repository checkout.',
               '- Maven PR Tests are green for draft PR #293, including clean headless verification, the repeated full test suite, and production JavaFX route compliance; the final PR head must remain unchanged after confirmation.\n- No local Maven result is claimed because the execution container cannot resolve GitHub and has no usable local repository checkout.'),
              ('- Run Maven PR Tests on the exact final PR #293 head and stop before merge.',
               '- Keep draft PR #293 unchanged after final green CI and stop before merge; owner desktop acceptance for P17-C1 remains separate.'),
          ]

          for old, new in replacements:
              count = s.count(old)
              assert count == 1, f'expected one match, got {count}: {old[:80]}'
              s = s.replace(old, new, 1)

          path.write_text(s)
          PY

          rm .github/workflows/apply-p17-c1-c1-ci-state.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/PLAN.md .github/workflows/apply-p17-c1-c1-ci-state.yml
          git commit -m "P17-C1-C1: record green draft PR verification"
          git push origin HEAD:codex/P17-C1-C1-plan-reconciliation
