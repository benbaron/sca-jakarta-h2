name: Temporary PR212 fixture correction

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  correct:
    if: ${{ github.event.pull_request.head.ref == 'codex/P15-S4-sclx-parties' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout party mapping branch
        uses: actions/checkout@v4
        with:
          ref: codex/P15-S4-sclx-parties
          fetch-depth: 0
      - name: Correct export-count fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/test/java/org/nonprofitbookkeeping/ui/SclxExportCoordinatorTest.java')
          text = path.read_text()
          old = 'new SclxExportCounts(1, 4, 2, 1, 3, 2, 3, 5, 10, 2, 2, 1, 31)'
          new = 'new SclxExportCounts(1, 4, 2, 1, 3, 2, 1, 3, 5, 10, 2, 1, 32)'
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/test/java/org/nonprofitbookkeeping/ui/SclxExportCoordinatorTest.java
          git diff --cached --quiet && exit 0
          git commit -m "Correct PR212 export count fixture"
          git push
