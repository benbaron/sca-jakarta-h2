name: Temporary PR212 Maven diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  capture:
    if: ${{ github.event.pull_request.head.ref == 'codex/P15-S4-sclx-parties' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout party mapping branch
        uses: actions/checkout@v4
        with:
          ref: codex/P15-S4-sclx-parties
          fetch-depth: 0
      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Capture Maven result
        shell: bash
        run: |
          set +e
          mvn -B -e -Djava.awt.headless=true clean verify > /tmp/pr212-maven.log 2>&1
          status=$?
          {
            echo "MAVEN_EXIT_CODE=$status"
            echo
            tail -n 300 /tmp/pr212-maven.log
          } > pr212-maven-diagnostic.log
          exit 0
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pr212-maven-diagnostic.log
          git commit -m "diagnose PR212 Maven failure" || exit 0
          git push
