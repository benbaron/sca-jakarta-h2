name: Codex P15-C5 Publish
on:
  push:
    branches:
      - codex/P15-S4-C5-period-close-export-integration
permissions:
  contents: write
jobs:
  publish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/P15-S4-C5-period-close-export-integration
          fetch-depth: 0
      - name: Apply corrective integration
        run: python .codex/apply_p15c5.py
      - name: Remove publication files
        run: rm -f .codex/apply_p15c5.py .github/workflows/codex-p15c5-publish.yml
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "P15-S4-C5: integrate period-close SCLX export"
          git push origin HEAD:codex/P15-S4-C5-period-close-export-integration
