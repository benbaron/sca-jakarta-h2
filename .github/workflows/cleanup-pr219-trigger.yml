name: Cleanup PR219 trigger
on:
  push:
    branches:
      - codex/P15-S4-C1-repair-fixed-assets-export-merge
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/P15-S4-C1-repair-fixed-assets-export-merge
          fetch-depth: 0
      - name: Remove trigger artifacts
        run: |
          rm -f .pr219-ci-trigger .github/workflows/cleanup-pr219-trigger.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Remove PR219 validation trigger artifacts'
          git push origin HEAD:codex/P15-S4-C1-repair-fixed-assets-export-merge
