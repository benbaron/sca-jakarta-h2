name: Temporary PR208 implementation publisher

on:
  push:
    branches:
      - codex/P15-S4-sclx-deterministic-file-export
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', 'Apply PR208 deterministic export implementation') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/P15-S4-sclx-deterministic-file-export
          fetch-depth: 0
      - name: Apply implementation files
        shell: bash
        run: |
          echo '' | base64 -d | tar -xzf -
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add doc/data-exchange/sclx.md src/main/java/org/nonprofitbookkeeping/interchange/sclx src/test/java/org/nonprofitbookkeeping/interchange/sclx
          git commit -m 'Apply PR208 deterministic export implementation'
          git push