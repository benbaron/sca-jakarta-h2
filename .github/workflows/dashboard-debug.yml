name: Dashboard Debug

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Capture Maven verification
        id: verify
        shell: bash
        run: |
          set +e
          mvn clean verify > maven-verification.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload verification log
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-maven-verification
          path: maven-verification.log
          if-no-files-found: error
      - name: Preserve verification result
        shell: bash
        run: exit "${{ steps.verify.outputs.status }}"
