name: P16-S2 production route bootstrap

on:
  push:
    branches:
      - codex/P16-S2-atomic-coa-csv-commit

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/P16-S2-atomic-coa-csv-commit
          fetch-depth: 0
      - name: Patch COA CSV production route
        shell: bash
        run: python .github/scripts/p16_s2_patch.py
      - name: Commit production route and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/p16-s2-ui-bootstrap.yml .github/scripts/p16_s2_patch.py
          git add src/main/java/org/nonprofitbookkeeping/ui/UiServiceRegistry.java \
                  src/main/java/org/nonprofitbookkeeping/ui/ImportPreviewPanel.java
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "P16-S2 route COA CSV commit atomically"
          git push origin HEAD:codex/P16-S2-atomic-coa-csv-commit
