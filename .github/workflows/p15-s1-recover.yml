name: P15-S1 Recover Validated Payload

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: codex/P15-S1-repair-clean-publication
          fetch-depth: 0
      - name: Diagnose preserved implementation blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p /tmp/p15-archive
          gh api --include repos/${{ github.repository }}/git/blobs/8754a7423c2ec91cac68502a25c3e9b72996e4d8 \
            > /tmp/p15-archive/blob-response.txt 2> /tmp/p15-archive/blob-error.txt
          echo $? > /tmp/p15-archive/blob-status.txt
          sed -n '1,40p' /tmp/p15-archive/blob-response.txt
          cat /tmp/p15-archive/blob-error.txt
          python3 - <<'PY'
          import base64, json, pathlib
          root = pathlib.Path('/tmp/p15-archive')
          text = root.joinpath('blob-response.txt').read_text(errors='replace')
          start = text.find('{')
          if start >= 0:
              try:
                  payload = json.loads(text[start:])
                  root.joinpath('blob-json.json').write_text(json.dumps(payload, indent=2))
                  content = payload.get('content')
                  if content:
                      root.joinpath('p15-s1-clean.tgz').write_bytes(base64.b64decode(content))
              except Exception as exc:
                  root.joinpath('decode-error.txt').write_text(repr(exc))
          PY
          if test -s /tmp/p15-archive/p15-s1-clean.tgz; then
            sha256sum /tmp/p15-archive/p15-s1-clean.tgz > /tmp/p15-archive/archive.sha256
            wc -c /tmp/p15-archive/p15-s1-clean.tgz > /tmp/p15-archive/archive.size
            tar -tzf /tmp/p15-archive/p15-s1-clean.tgz > /tmp/p15-archive/members.txt 2> /tmp/p15-archive/tar-error.txt
            echo $? > /tmp/p15-archive/tar-status.txt
            cat /tmp/p15-archive/archive.sha256
            cat /tmp/p15-archive/archive.size
            cat /tmp/p15-archive/members.txt
          fi
          exit 0
      - name: Upload blob diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: p15-s1-blob-diagnostics
          path: /tmp/p15-archive
          if-no-files-found: error
          retention-days: 1
