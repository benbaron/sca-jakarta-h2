name: P15-S1 Recover Validated Payload

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: codex/P15-S1-repair-clean-publication
          fetch-depth: 0
      - name: Fetch and verify preserved implementation archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p15-archive
          gh api repos/${{ github.repository }}/git/blobs/8754a7423c2ec91cac68502a25c3e9b72996e4d8 \
            --jq .content | tr -d '\n' | base64 -d > /tmp/p15-archive/p15-s1-clean.tgz
          echo 'c2271b20858fe71b67580744f092ce538b2c52acb0abcac658368f177f7017a1  /tmp/p15-archive/p15-s1-clean.tgz' \
            | sha256sum -c -
          test "$(wc -c < /tmp/p15-archive/p15-s1-clean.tgz)" -eq 98872
          tar -tzf /tmp/p15-archive/p15-s1-clean.tgz > /tmp/p15-archive/members.txt
          test "$(grep -c '/$' /tmp/p15-archive/members.txt || true)" -ge 1
          test "$(grep -vc '/$' /tmp/p15-archive/members.txt)" -eq 64
          grep -E 'V61__company_ownership_and_interchange_identity.sql|ExternalInterchangeIdentity|InterchangeOperation' /tmp/p15-archive/members.txt
          cat /tmp/p15-archive/members.txt
      - name: Upload verified archive
        uses: actions/upload-artifact@v4
        with:
          name: p15-s1-clean-archive
          path: /tmp/p15-archive
          if-no-files-found: error
          retention-days: 1
