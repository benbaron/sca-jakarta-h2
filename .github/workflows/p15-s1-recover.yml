name: P15-S1 Recover Validated Payload

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: codex/P15-S1-repair-clean-publication
          fetch-depth: 0
      - name: Reconstruct available payload
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/p15-recovered
          cat .p15-s1-small/payload.part{00..15} > /tmp/p15-payload.b64
          base64 -d /tmp/p15-payload.b64 > /tmp/p15-payload.tgz 2>/tmp/p15-base64.err
          echo $? > /tmp/p15-base64.status
          gzip -dc /tmp/p15-payload.tgz > /tmp/p15-payload.tar 2>/tmp/p15-gzip.err
          echo $? > /tmp/p15-gzip.status
          tar -tvf /tmp/p15-payload.tar > /tmp/p15-recovered-list.txt 2>/tmp/p15-tar-list.err
          echo $? > /tmp/p15-tar-list.status
          tar -xf /tmp/p15-payload.tar -C /tmp/p15-recovered --ignore-zeros 2>/tmp/p15-tar-extract.err
          echo $? > /tmp/p15-tar-extract.status
          find /tmp/p15-recovered -type f -print | sort > /tmp/p15-recovered-files.txt
          wc -c /tmp/p15-payload.b64 /tmp/p15-payload.tgz /tmp/p15-payload.tar > /tmp/p15-sizes.txt
          cat /tmp/p15-sizes.txt
          cat /tmp/p15-recovered-files.txt
          exit 0
      - name: Upload recovered implementation and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: p15-s1-recovered
          path: |
            /tmp/p15-recovered
            /tmp/p15-recovered-list.txt
            /tmp/p15-recovered-files.txt
            /tmp/p15-payload.b64
            /tmp/p15-payload.tgz
            /tmp/p15-payload.tar
            /tmp/p15-*.err
            /tmp/p15-*.status
            /tmp/p15-sizes.txt
          if-no-files-found: error
          retention-days: 1
