name: Publish PR218 plan reconciliation
on:
  push:
    branches:
      - codex/P15-S4-fixed-assets-sclx-export
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/P15-S4-fixed-assets-sclx-export
          fetch-depth: 0
      - name: Apply reviewed plan patch
        shell: bash
        run: |
          cat .p15-plan/chunk-* | base64 -d | gzip -d > /tmp/plan218.patch
          echo '4219b905119597e4b57f821e07541c0be5027775783f11f538b3b4052710213e  /tmp/plan218.patch' | sha256sum -c -
          patch -p1 < /tmp/plan218.patch
          rm -rf .p15-plan .github/workflows/publish-pr218-plan.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Reconcile P15-S4 fixed-assets export plan'
          git push origin HEAD:codex/P15-S4-fixed-assets-sclx-export
