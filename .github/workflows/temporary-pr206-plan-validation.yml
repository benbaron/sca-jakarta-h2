name: Temporary PR206 validation reconciliation

on:
  push:
    branches:
      - codex/P15-S4-sclx-transaction-portable-id

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record final validation and remove workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('doc/PLAN.md')
          text = path.read_text()
          replacements = [
              ('active_head: "cc795b5039ef20b43f7af6608e874d406fe5fc30"', 'active_head: "db1bae8fad0b0bdea50e1b80fadbedea225eeb48"'),
              ('Current implementation head: `cc795b5039ef20b43f7af6608e874d406fe5fc30`', 'Current tested implementation head: `db1bae8fad0b0bdea50e1b80fadbedea225eeb48`'),
              ('- PR #206 automated validation is pending.', '- Initial PR #206 run `30228781451` exposed a complete-schema recovery conflict because Hibernate could already create `txn.portable_id`; V62 was corrected to use recovery-safe `IF NOT EXISTS` operations.\n- Maven PR Tests run `30229244201` passed on clean review head `db1bae8fad0b0bdea50e1b80fadbedea225eeb48`, including `mvn clean verify`, the repeated test suite, and JavaFX production-route compliance.'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing PLAN.md text: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git rm .github/workflows/temporary-pr206-plan-validation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add doc/PLAN.md
          git commit -m "Record PR 206 validation"
          git push
