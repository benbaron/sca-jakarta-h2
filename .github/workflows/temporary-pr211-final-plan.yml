name: Temporary PR211 final plan reconciliation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ github.event.pull_request.head.ref == 'codex/P15-S4-party-portable-identity' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prerequisite branch
        uses: actions/checkout@v4
        with:
          ref: codex/P15-S4-party-portable-identity
          fetch-depth: 0
      - name: Record validated prerequisite head
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('doc/PLAN.md')
          text = path.read_text()
          replacements = [
              ('plan_version: 86', 'plan_version: 87'),
              ('active_head: "a053f69e0aeca9e308f26120f18c9b028098b0a4"',
               'active_head: "41280d0f26fe58afaf8f25fb71dd76035d2eebd8"'),
              ('Current implementation head awaiting Maven PR validation: `a053f69e0aeca9e308f26120f18c9b028098b0a4`',
               'Current tested implementation head: `41280d0f26fe58afaf8f25fb71dd76035d2eebd8`'),
              ('- PR #211 Java sources and focused tests passed Java 17 syntax compilation with bounded local stubs; Maven PR validation is pending.',
               '- PR #211 Java sources and focused tests passed Java 17 syntax compilation with bounded local stubs.\n- Maven PR Tests run `30323574869` passed on clean, plan-inclusive PR #211 head `41280d0f26fe58afaf8f25fb71dd76035d2eebd8`, including `mvn clean verify`, the repeated Maven test suite, and JavaFX production-route compliance.')
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence, found {count}: {old[:100]}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add doc/PLAN.md
          git commit -m "Record PR211 validation evidence"
          git push
