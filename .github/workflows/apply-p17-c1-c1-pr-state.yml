name: Apply P17-C1-C1 PR state

on:
  push:
    branches:
      - codex/P17-C1-C1-plan-reconciliation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/P17-C1-C1-plan-reconciliation
          fetch-depth: 0

      - name: Record draft PR state and remove helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('doc/PLAN.md')
          s = path.read_text()

          replacements = [
              ('active_status: IN_PROGRESS', 'active_status: VERIFYING'),
              ('active_pull_request: pending', 'active_pull_request: 293'),
              ('active_head: pending_publication', 'active_head: published_pr_293'),
              ('next_action: "Publish the documentation-only P17-C1-C1 reconciliation from current main, run Maven PR Tests on its exact head, and stop before merge. P17-C1 remains VERIFYING until the owner explicitly accepts the desktop checklist."',
               'next_action: "Run Maven PR Tests on the exact final PR #293 head and stop before merge. P17-C1 remains VERIFYING until the owner explicitly accepts the desktop checklist."'),
              ('Status: IN_PROGRESS.\n\nBranch: `codex/P17-C1-C1-plan-reconciliation`\nBase head: `a96eb39db1a3ed5b9ece309dcca1d1d046e327e1`\nPull request: pending',
               'Status: VERIFYING.\n\nBranch: `codex/P17-C1-C1-plan-reconciliation`\nBase head: `a96eb39db1a3ed5b9ece309dcca1d1d046e327e1`\nPull request: #293 (draft)'),
              ('- Maven PR Tests are required on the published documentation-only head; no local Maven result is claimed because the execution container cannot resolve GitHub and has no usable local repository checkout.',
               '- Draft PR #293 is open from exact current `main`, and its current comparison changes only `doc/PLAN.md`.\n- Maven PR Tests are required on the exact final PR head; no local Maven result is claimed because the execution container cannot resolve GitHub and has no usable local repository checkout.'),
              ('- Publish this documentation-only reconciliation, run Maven PR Tests on its exact PR head, and stop before merge.',
               '- Run Maven PR Tests on the exact final PR #293 head and stop before merge.'),
          ]

          for old, new in replacements:
              count = s.count(old)
              assert count == 1, f'expected one match, got {count}: {old[:80]}'
              s = s.replace(old, new, 1)

          path.write_text(s)
          PY

          rm .github/workflows/apply-p17-c1-c1-pr-state.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/PLAN.md .github/workflows/apply-p17-c1-c1-pr-state.yml
          git commit -m "P17-C1-C1: record draft PR verification state"
          git push origin HEAD:codex/P17-C1-C1-plan-reconciliation
