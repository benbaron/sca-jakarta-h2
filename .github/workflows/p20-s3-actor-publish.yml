name: P20-S3 actor publication bootstrap

on:
  push:
    branches:
      - codex/P20-S3-authenticated-audit-actor

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed actor patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/p20-s3-authenticated-audit-actor.patch.gz.b64 | gunzip > /tmp/actor.patch
          git apply --check /tmp/actor.patch
          git apply /tmp/actor.patch
          rm .github/p20-s3-authenticated-audit-actor.patch.gz.b64
          rm .github/workflows/p20-s3-actor-publish.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "P20-S3: enforce authenticated audit actor"
          git push origin HEAD:codex/P20-S3-authenticated-audit-actor
