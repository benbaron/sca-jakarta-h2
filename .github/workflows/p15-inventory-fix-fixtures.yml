name: P15 Inventory Fix Fixtures

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'codex/P15-S4-C3-inventory-sclx-export'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/P15-S4-C3-inventory-sclx-export
          fetch-depth: 0
      - name: Reconcile fixed-asset fixtures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/test/java/org/nonprofitbookkeeping/interchange/sclx/SclxFixedAssetSnapshotTest.java')
          text = path.read_text()
          text = text.replace(
              '                List.of(fixture.run()),\n                Instant.EPOCH));',
              '                List.of(fixture.run()),\n                List.of(),\n                List.of(),\n                Instant.EPOCH));')
          text = text.replace(
              '                includeRun ? List.of(fixture.run()) : List.of(),\n                Instant.parse("2026-03-01T00:00:00Z"));',
              '                includeRun ? List.of(fixture.run()) : List.of(),\n                List.of(),\n                List.of(),\n                Instant.parse("2026-03-01T00:00:00Z"));')
          path.write_text(text)
          PY
          rm -f .github/workflows/p15-inventory-fix-fixtures.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Reconcile fixed-asset fixtures with inventory export'
          git push origin HEAD:codex/P15-S4-C3-inventory-sclx-export
