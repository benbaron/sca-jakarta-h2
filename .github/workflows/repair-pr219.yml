name: Repair PR219
on:
  push:
    branches:
      - codex/P15-S4-C1-repair-fixed-assets-export-merge
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/P15-S4-C1-repair-fixed-assets-export-merge
          fetch-depth: 0
      - name: Restore reviewed sources
        shell: bash
        run: |
          base64 -d .p15-repair/payload.b64 > /tmp/fix218.tgz
          tar -xzf /tmp/fix218.tgz
          rm -rf .p15-repair .github/workflows/repair-pr219.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'P15-S4-C1: repair merged fixed-asset export assembly'
          git push origin HEAD:codex/P15-S4-C1-repair-fixed-assets-export-merge
