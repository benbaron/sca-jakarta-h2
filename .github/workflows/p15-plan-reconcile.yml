name: P15 Plan Reconcile

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'codex/P15-S4-C3-inventory-sclx-export'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/P15-S4-C3-inventory-sclx-export
          fetch-depth: 0
      - name: Reconcile P15 execution ledger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('doc/PLAN.md')
          s = p.read_text()
          s = s.replace('plan_version: 93', 'plan_version: 94', 1)
          s = s.replace('active_status: VERIFYING\nactive_branch: codex/P15-S4-fixed-assets-sclx-export\nactive_pull_request: 218\nactive_head: "049617344f778000be5e571c40b3c8b8055758e6"\nnext_action: "Validate and merge PR #218, then implement the next deferred selected-company SCLX section on a fresh P15-S4 branch."', 'active_status: VERIFYING\nactive_branch: codex/P15-S4-C3-inventory-sclx-export\nactive_pull_request: 223\nactive_head: "97c8856a9ab589e776497b70f5e9bec29e71e4d1"\nnext_action: "Run authoritative Maven PR validation for PR #223, correct any remaining failures, then mark the PR ready for review."', 1)
          s = s.replace('This revision records durable fixed-asset/depreciation-run identities merged through PR #216 and selected-company fixed-asset/depreciation SCLX export in draft PR #218.', 'This revision records fixed-asset export corrections merged through PR #220, durable inventory identities merged through PR #221, the inventory SCLX contract merged through PR #222, and its production implementation in corrective PR #223.', 1)
          s = s.replace('Status: VERIFYING on branch `codex/P15-S4-fixed-assets-sclx-export` in draft PR #218.\n\nCurrent tested implementation head: `049617344f778000be5e571c40b3c8b8055758e6`', 'Status: VERIFYING on branch `codex/P15-S4-C3-inventory-sclx-export` in draft PR #223.\n\nCurrent validation target head: `97c8856a9ab589e776497b70f5e9bec29e71e4d1`', 1)
          needle = '- PR #218: selected-company fixed assets and completed depreciation runs under `extensions.scaJakartaH2.fixedAssets`, preserving all authoritative asset fields, account/fund references, canonical transaction provenance, deterministic intrinsic identities, exact counts, strict ownership/reference validation, and nullable notes.\n'
          insert = needle + '- PR #219: corrective repair of the merged fixed-asset export assembly after overlapping implementations caused production compilation drift.\n- PR #220: fixed-asset test-contract reconciliation, restoring governed accessors, identities, builder ordering, and assembler calls.\n- PR #221: intrinsic UUID portable identities for inventory items and movements, with V66 recovery-safe backfill/default/non-null/uniqueness enforcement.\n- PR #222: governed `extensions.scaJakartaH2.inventory` contract documentation only; no production implementation was included.\n- PR #223: corrective selected-company inventory item and movement export implementation, including deterministic identities/order, strict ownership/reference validation, exact counts, completion-summary integration, and focused tests.\n'
          if needle not in s:
              raise SystemExit('P15 deliverable insertion point missing')
          s = s.replace(needle, insert, 1)
          valneedle = '- Clean PR #218 implementation run `30476305641` passed `mvn clean verify`, the repeated Maven test suite, and JavaFX production-route compliance on exact head `049617344f778000be5e571c40b3c8b8055758e6`.\n'
          valinsert = valneedle + '- PR #218 subsequently merged, and corrective PRs #219 and #220 restored production/test contract consistency; PR #220 merged at `88ab6a816f01d8b39245ee16c0d8c09fd66e87a4`.\n- PR #221 passed Maven PR Tests run `30505370010` on head `58c59d8f366b7111b804ba4df75245eefc40f4f0` and merged at `99262cdd7e579943c62ec21eea7927d6f8f123a0`.\n- PR #222 merged at `3e8c7c8220a8cfe20ee697d835e28d4cc69e4092` but changed only `doc/data-exchange/inventory-sclx.md`; production inventory export remained open.\n- PR #223 publication run `30511264525` reconstructed a SHA-256-verified source archive and removed all temporary payload/workflow files in the resulting implementation commit.\n- Initial normal PR #223 run `30511334865` compiled production sources but exposed two stale fixed-asset test calls using the pre-inventory assembler signature; the fixtures were corrected to pass empty inventory lists.\n- Corrected PR #223 run `30511454947` compiled production and test sources and ran 462 tests; 461 passed and one new inventory test exposed that the shared extension reader incorrectly required optional fields to be present.\n- The shared extension reader now rejects unknown fields while permitting governed optional fields to be omitted; required fields remain enforced by typed readers. The resulting bot-authored head `97c8856a9ab589e776497b70f5e9bec29e71e4d1` requires a normal plan-inclusive commit to trigger authoritative Maven validation.\n'
          if valneedle not in s:
              raise SystemExit('P15 validation insertion point missing')
          s = s.replace(valneedle, valinsert, 1)
          s = s.replace('- Validate and merge PR #218, then start a fresh P15-S4 branch for the next deferred selected-company SCLX section; complete owner desktop acceptance before P15-S4 is marked done.', '- Run authoritative Maven PR validation for PR #223, correct any remaining failures, mark it ready for review, and merge only after owner authorization. Period-close and factual audit-history export remain subsequent fresh P15-S4 slices.', 1)
          p.write_text(s)
          PY
          rm -f .github/workflows/p15-plan-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'P15-S4-C3 reconcile inventory export plan'
          git push origin HEAD:codex/P15-S4-C3-inventory-sclx-export
