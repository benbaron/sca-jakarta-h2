name: Temporary P15 plan reconciliation

on:
  push:
    branches:
      - codex/P15-S4-sclx-core-snapshot-query

permissions:
  contents: write

jobs:
  reconcile-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile P15 execution state
        shell: python
        run: |
          from pathlib import Path

          path = Path("doc/PLAN.md")
          text = path.read_text(encoding="utf-8")

          replacements = [
              ("plan_version: 79", "plan_version: 80"),
              ("active_slice: P15-S3", "active_slice: P15-S4"),
              ("active_status: VERIFYING", "active_status: IN_PROGRESS"),
              ("active_branch: codex/P15-S3-coa-json-import-export", "active_branch: codex/P15-S4-sclx-core-snapshot-query"),
              ("active_pull_request: 197", "active_pull_request: 205"),
              ("active_head: \"555206c60009410fe0a51afe9a1fff6957572cd6\"", "active_head: \"413e0712004e5c2b8035a88d34c61eaa1463832b\""),
              ("next_action: \"Complete the documented Chart of Accounts JSON desktop acceptance checks; after owner confirmation, merge PR #197 and advance to P15-S4.\"", "next_action: \"Validate and merge PR #205, then continue P15-S4 with budget and canonical-transaction snapshot mapping.\""),
              ("This revision records owner-verified P15-S2 database transfer completion and advances P15-S3 Chart of Accounts JSON interchange to final verification in draft PR #197.", "This revision reconciles merged P15-S3 and incremental P15-S4 work through PR #204, and records the bounded selected-company core snapshot query in draft PR #205."),
              ("| P15 | Versioned data interchange and database transfer | P02, P05, P06, P12, P13, P14 | VERIFYING at P15-S3 |", "| P15 | Versioned data interchange and database transfer | P02, P05, P06, P12, P13, P14 | IN_PROGRESS at P15-S4 |"),
              ("Status: VERIFYING on branch `codex/P15-S3-coa-json-import-export` in draft PR #197.\n\nTested implementation head: `ae8a30de51f166c8081b6974921b7aa771de1579`", "Status: DONE through merged PR #197 after owner desktop acceptance.\n\nFinal implementation head: `16235ba0b8bc02caa525a90465a4027c95dae5a0`"),
              ("Remaining deliverable:\n\n- Complete the owner desktop acceptance checklist in `doc/data-exchange/chart-of-accounts-json.md`.\n\nNext exact action:\n\n- Present the Chart of Accounts JSON desktop acceptance steps to the owner; keep PR #197 draft until acceptance is confirmed.", "Owner verification:\n\n- The owner completed the documented Chart of Accounts JSON desktop acceptance checks and authorized merge.\n- PR #197 merged to `main` at `80fc7367d5b66f77a0d8d4414b1fc20a224b93e7`.\n\nNext exact action:\n\n- None; P15-S3 is DONE."),
              ("Status: BLOCKED until P15-S1 and P15-S3 merge.\n\nPlanned deliverables:", "Status: IN_PROGRESS on branch `codex/P15-S4-sclx-core-snapshot-query` in draft PR #205.\n\nCurrent implementation head: `413e0712004e5c2b8035a88d34c61eaa1463832b`\n\nIncremental completed deliverables:\n\n- PR #198: SCLX version/account-mode scaffold and governed source artifact publication.\n- PR #199: strict bounded UTF-8 parser for SCLX 1.0, 1.2, and 1.3.\n- PR #200: structural/reference validation and entity limits.\n- PR #201: immutable SCLX 1.3 export DTO and governed included/excluded section catalog.\n- PR #202: export snapshot identity/reference validation and exact debit/credit balance checks.\n- PR #203: deterministic H2-independent portable identity derivation.\n- PR #204: selected-company core DTO assembly for company, active-chart accounts, and funds.\n- PR #205: bounded JPA loading of selected-company active-chart accounts and company-owned funds, with inactive-row retention and multi-company isolation coverage.\n\nValidation status:\n\n- PRs #198 through #204 are merged.\n- Maven PR Tests run `30221018029` passed on PR #204 head `2663adf380b47a94776234ac62247480f38712da`.\n- Maven PR Tests run `30221508687` passed on PR #205 head `413e0712004e5c2b8035a88d34c61eaa1463832b`.\n\nPlanned deliverables:"),
              ("- No local numeric primary key is used as a portable identity.\n\n## P15-S5", "- No local numeric primary key is used as a portable identity.\n\nNext exact action:\n\n- Obtain owner validation for PR #205, merge it, then start a fresh P15-S4 branch for budget and canonical-transaction mapping.\n\n## P15-S5"),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Required PLAN.md text not found: {old[:100]}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

      - name: Commit plan reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/PLAN.md
          git commit -m "Reconcile P15 plan state [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
