name: Temporary PR209 Maven diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  capture:
    if: ${{ github.event.pull_request.head.ref == 'codex/P15-S4-sclx-export-ui' && !contains(github.event.pull_request.head.sha, 'diagnostic') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/P15-S4-sclx-export-ui
          fetch-depth: 0
      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Capture focused verification
        shell: bash
        run: |
          set +e
          mvn -B -ntp -e -Dtest=SclxExportMenuInstallerTest,SclxExportCoordinatorTest,SclxExportProductionRouteSourceTest test --settings .mvn/settings-github.xml -Dmaven.repo.local=$HOME/.m2/repository > pr209-diagnostic.log 2>&1
          status=$?
          echo "MAVEN_EXIT_CODE=$status" >> pr209-diagnostic.log
          tail -n 300 pr209-diagnostic.log > pr209-diagnostic-tail.log
          exit 0
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pr209-diagnostic.log pr209-diagnostic-tail.log
          git commit -m "Capture PR209 diagnostic"
          git push
