name: P22 S4 Publisher

on:
  push:
    branches:
      - codex/P22-S4-publisher

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and verify P22-S4
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/p22s4.patch.gz.b64 <<'PATCH_B64'
          
          PATCH_B64
          base64 -d /tmp/p22s4.patch.gz.b64 | gzip -d > /tmp/p22s4.patch
          patch -p2 < /tmp/p22s4.patch
          test "$(git hash-object doc/PLAN.md)" = "a285874d561accc737eb285c8c8aecde80dd96b8"
          test "$(git hash-object doc/persistence-authority-inventory.md)" = "6e19a1e877afd7406b375d9c8e423c73ee1d3508"
          test "$(git hash-object doc/ui/editor-guidelines.md)" = "579acc7e1a0d1f250b09c4f763abd92dd529173a"
          test "$(git hash-object src/main/java/org/nonprofitbookkeeping/ui/JournalWorkspacePanel.java)" = "031d98dd3577996fa294cf2e656b2f3548a026ab"
          test "$(git hash-object src/test/java/org/nonprofitbookkeeping/ui/JournalWorkspacePortSourceTest.java)" = "5d25d4c00762b2ec7ad2b162a049d3e561bf540f"
          ! grep -q 'java.util.prefs.Preferences' src/main/java/org/nonprofitbookkeeping/ui/JournalWorkspacePanel.java
          git diff --check
          rm .github/workflows/p22-s4-publisher.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --name-status
          git commit -m "P22-S4: establish Journal UI-state authority"
          git push origin HEAD:codex/P22-S4-publisher
