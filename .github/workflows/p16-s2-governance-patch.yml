name: P16 S2 governance patch

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 253
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply governance updates
        env:
          PATCH_SCRIPT_B64: "__B64__"
        run: |
          printf '%s' "$PATCH_SCRIPT_B64" | base64 -d > /tmp/p16_s2_patch.py
          python /tmp/p16_s2_patch.py
          rm .github/workflows/p16-s2-governance-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Finalize P16-S2 governance documentation"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
