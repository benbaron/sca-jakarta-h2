name: P15 Inventory Publish

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'codex/P15-S4-C3-inventory-sclx-export'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/P15-S4-C3-inventory-sclx-export
          fetch-depth: 0
      - name: Apply reviewed inventory implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .github/p15-inventory-payload/chunk-* | base64 --decode > /tmp/inventory-impl.tar.gz
          echo '8ba7b48141c52ab65becfff4aada9beccdb4cdc43ced227807354542c9b951d8  /tmp/inventory-impl.tar.gz' | sha256sum -c -
          tar -xzf /tmp/inventory-impl.tar.gz
          rm -rf .github/p15-inventory-payload
          rm -f .github/workflows/p15-inventory-publish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'P15-S4-C3 implement inventory SCLX export'
          git push origin HEAD:codex/P15-S4-C3-inventory-sclx-export
