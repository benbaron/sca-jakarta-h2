name: P20-S3 JavaFX gating publication bootstrap

on:
  push:
    branches:
      - codex/P20-S3-javafx-permission-gating-bootstrap

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish reviewed JavaFX permission gating patch
        shell: bash
        run: |
          set -euo pipefail
          BASE=841f17d91bf85f1337f3f71b4fcd719c26f15404
          TARGET=codex/P20-S3-javafx-permission-gating
          EXPECTED_TARGET=85b2481b1aa32fe08f24a4ce443294f64e347373
          current="$(git ls-remote origin refs/heads/$TARGET | awk '{print $1}')"
          test "$current" = "$EXPECTED_TARGET"
          cp .github/p20-s3-ui-gating-paths.txt /tmp/expected-paths.txt
          cp .github/p20-s3-ui-gating-blobs.txt /tmp/expected-blobs.txt
          cat .github/p20-s3-ui-gating-chunks/chunk-* > /tmp/patch.b64
          echo 'd75a8ad2d4fea22289dcce57deae2bb0fd1db9a6e87c419b9d87781dbd381b3c  /tmp/patch.b64' | sha256sum -c -
          base64 -d /tmp/patch.b64 > /tmp/patch.gz
          echo '250f9c2fc69905e0a1208ee2c8f37c1d58cdf8945988edb485ab980650f93dc8  /tmp/patch.gz' | sha256sum -c -
          gunzip -c /tmp/patch.gz > /tmp/patch
          echo '0cb19f49fa07a6e83a31ec0a7eade6cc0196f95e6330c771e59de9e856fc3a07  /tmp/patch' | sha256sum -c -
          git checkout -B publish "$current"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          rm .github/p20-s3-javafx-permission-gating.patch.gz.b64
          rm .github/p20-s3-javafx-permission-gating.blobs
          rm .github/workflows/p20-s3-javafx-gating-publish.yml
          git apply --check /tmp/patch
          git apply /tmp/patch
          git diff --check
          git add -A
          git diff --cached "$BASE" --name-only | LC_ALL=C sort > /tmp/actual-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt
          while read -r expected path; do
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected" || { echo "blob mismatch: $path expected=$expected actual=$actual" >&2; exit 1; }
          done < /tmp/expected-blobs.txt
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "P20-S3: enforce JavaFX permission gating"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_TARGET"
          git push origin HEAD:$TARGET
